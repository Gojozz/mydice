import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
window.addEventListener('pointerdown', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });

function playHitSFX(vol = 0.2) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(320 + Math.random() * 120, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.07);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.07);
}

function playBombSFX() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const bufferSize = audioCtx.sampleRate * 0.95;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(700, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.4);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start(); noise.stop(audioCtx.currentTime + 0.4);

  const sub = audioCtx.createOscillator();
  const subGain = audioCtx.createGain();
  sub.type = 'triangle';
  sub.frequency.setValueAtTime(130, audioCtx.currentTime);
  sub.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.38);
  subGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  subGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.38);
  sub.connect(subGain); subGain.connect(audioCtx.destination);
  sub.start(); sub.stop(audioCtx.currentTime + 0.38);
}

function playPortalSFX() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.26);
  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.26);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.26);
}

function playBoostSFX() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(280, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 0.16);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.16);
}

function playStarSFX() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const freqs = [523.25, 659.25, 783.99];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.05);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + i * 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.05);
    osc.stop(audioCtx.currentTime + i * 0.05 + 0.12);
  });
}

// PERBAIKAN: Lantai diperluas (3.5x lebih lebar/panjang), ukuran labirin tetap sama
const boardWidth = (SIZE_X * CELL + 1) * 3.5;

// Lantai khusus area maze
const mazeFloorWidth = SIZE_X * CELL + 0.9;

const mazeFloor = new THREE.Mesh(

const maze=new THREE.Group();scene.add(maze);

const walls=[], traps=[], stars=[], boosts=[];
const wallMat=new THREE.MeshStandardMaterial({color:0x35251b,roughness:0.5});
let cells = [], exitPos={x:HALF_X*CELL, z:HALF_Z*CELL};

function addWall(x,z,w,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.8,d),wallMat);
  m.position.set(x,1.2,z);
  m.castShadow=false;

}

function createTrapMesh(px, pz, type){
  if(type === 'hole_blue'){
    const holeGroup = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.6, 1.25, 32), 
      new THREE.MeshBasicMaterial({color: 0x00c8ff, side: THREE.DoubleSide})
    );
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04;
    const holeCore = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.1, 32), new THREE.MeshBasicMaterial({color: 0x000000}));
    holeCore.position.y = 0.02;
    holeGroup.add(ring, holeCore); holeGroup.position.set(px, 0, pz);
    trapGroup.add(holeGroup);
    traps.push({x: px, z: pz, type, mesh: holeGroup, active: true, ring});
  } else if(type === 'bomb'){
    const bGroup = new THREE.Group();
    const bombBody = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({color: 0x111111, emissive: 0xff2200, emissiveIntensity: 0.8, roughness:0.2}));
    bombBody.position.y = 0.8;
    bombBody.castShadow = false;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.4, 8), new THREE.MeshStandardMaterial({color: 0xffaa00}));
    cap.position.set(0, 1.5, 0);
    cap.castShadow = false;
    bGroup.add(bombBody, cap); bGroup.position.set(px, 0, pz);
    trapGroup.add(bGroup);
    traps.push({x: px, z: pz, type: 'bomb', mesh: bGroup, active: true, body: bombBody});
  }
}

function createStarMesh(px, pz){
  const starGeo = new THREE.OctahedronGeometry(0.7, 0);
  const starMat = new THREE.MeshStandardMaterial({color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8, metalness: 0.8, roughness: 0.2});
  const mesh = new THREE.Mesh(starGeo, starMat);
  mesh.position.set(px, 0.8, pz);
  mesh.castShadow = false;
  starGroup.add(mesh);
  stars.push({x: px, z: pz, mesh, active: true});
}

function createBoostPadMesh(px, pz){
  const bGroup = new THREE.Group();
  const padPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(CELL * 0.75, CELL * 0.75),
    new THREE.MeshStandardMaterial({color: 0x00ff88, emissive: 0x00ff66, emissiveIntensity: 0.7, side: THREE.DoubleSide, roughness:0.3})

  );

  bGroup.add(padPlane, arrowMesh);
  bGroup.position.set(px, 0, pz);
  boostGroup.add(bGroup);
  boosts.push({x: px, z: pz, mesh: bGroup, arrow: arrowMesh});
}

function generateMaze(){
  while(maze.children.length) maze.remove(maze.children[0]);
  while(trapGroup.children.length) trapGroup.remove(trapGroup.children[0]);
  while(starGroup.children.length) starGroup.remove(starGroup.children[0]);
  while(boostGroup.children.length) boostGroup.remove(boostGroup.children[0]);
  walls.length=0; traps.length=0; stars.length=0; boosts.length=0; cells=[];

  for(let z=0;z<SIZE_Z;z++){cells[z]=[];for(let x=0;x<SIZE_X;x++) cells[z][x]={v:false,w:[true,true,true,true]};}
  const dirs=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
  function carve(x,z){
    cells[z][x].v=true;
    for(const di of [0,1,2,3].sort(()=>Math.random()-0.5)){
      const nx=x+dirs[di][0],nz=z+dirs[di][1];
      if(nx>=0&&nx<SIZE_X&&nz>=0&&nz<SIZE_Z&&!cells[nz][nx].v){
        cells[z][x].w[dirs[di][2]]=false;cells[nz][nx].w[dirs[di][3]]=false;carve(nx,nz);
      }
    }
  }
  carve(0,0);

  for(let z=0; z<=2; z++){
    for(let x=0; x<=2; x++){
      if(x+1 <= 2){ cells[z][x].w[1] = false; cells[z][x+1].w[3] = false; }
      if(z+1 <= 2){ cells[z][x].w[2] = false; cells[z+1][x].w[0] = false; }
    }
  }

  for(let z=1;z<SIZE_Z-1;z++) for(let x=1;x<SIZE_X-1;x++){
    if(Math.random()<0.05){
      const d=Math.floor(Math.random()*4);
      cells[z][x].w[d]=false;
      const nx=x+dirs[d][0], nz=z+dirs[d][1];
      if(nx>=0&&nx<SIZE_X&&nz>=0&&nz<SIZE_Z) cells[nz][nx].w[dirs[d][3]]=false;
    }
  }

  const allValidCells = [];
  for(let z=1; z<SIZE_Z-1; z++){
    for(let x=1; x<SIZE_X-1; x++){
      if((x<=2 && z<=2) || (x===SIZE_X-1 && z===SIZE_Z-1)) continue;
      allValidCells.push({x, z});
    }
  }

  const occupiedKeys = new Set();
  allValidCells.sort(() => Math.random() - 0.5);

  const blueCount = Math.min(Math.floor(allValidCells.length * 0.4), 4 * trapMultiplier);
  for(let i = 0; i < blueCount; i++){
    const cell = allValidCells[i];
    const px = (cell.x - HALF_X)*CELL, pz = (cell.z - HALF_Z)*CELL;
    createTrapMesh(px, pz, 'hole_blue');
    occupiedKeys.add(`${cell.x},${cell.z}`);
  }

  const remainingForBombs = allValidCells.filter(c => !occupiedKeys.has(`${c.x},${c.z}`));
  remainingForBombs.sort(() => Math.random() - 0.5);
  const bombCount = Math.min(remainingForBombs.length, 4 * trapMultiplier);
  for(let i = 0; i < bombCount; i++){
    const cell = remainingForBombs[i];
    const px = (cell.x - HALF_X)*CELL, pz = (cell.z - HALF_Z)*CELL;
    createTrapMesh(px, pz, 'bomb');
    occupiedKeys.add(`${cell.x},${cell.z}`);
  }

  const remainingForStars = allValidCells.filter(c => !occupiedKeys.has(`${c.x},${c.z}`));
  remainingForStars.sort(() => Math.random() - 0.5);
  const starCount = Math.min(remainingForStars.length, 5);
  for(let i = 0; i < starCount; i++){
    const cell = remainingForStars[i];
    const px = (cell.x - HALF_X)*CELL, pz = (cell.z - HALF_Z)*CELL;
    createStarMesh(px, pz);
    occupiedKeys.add(`${cell.x},${cell.z}`);
  }

  const remainingForBoosts = allValidCells.filter(c => !occupiedKeys.has(`${c.x},${c.z}`));
  remainingForBoosts.sort(() => Math.random() - 0.5);
  const boostCount = Math.min(remainingForBoosts.length, 5);
  for(let i = 0; i < boostCount; i++){
    const cell = remainingForBoosts[i];
    const px = (cell.x - HALF_X)*CELL, pz = (cell.z - HALF_Z)*CELL;
    createBoostPadMesh(px, pz);
  }

  for(let z=0;z<SIZE_Z;z++) for(let x=0;x<SIZE_X;x++){
    const c=cells[z][x],px=(x-HALF_X)*CELL,pz=(z-HALF_Z)*CELL;
    if(c.w[0]) addWall(px,pz-CELL/2,CELL+0.25,0.4);
    if(c.w[1]) addWall(px+CELL/2,pz,0.4,CELL+0.25);
    if(c.w[2]&&!(x===SIZE_X-1&&z===SIZE_Z-1)) addWall(px,pz+CELL/2,CELL+0.25,0.4);
    if(c.w[3]) addWall(px-CELL/2,pz,0.4,CELL+0.25);
  }
  const edgeX=HALF_X*CELL+CELL/2+0.2, edgeZ=HALF_Z*CELL+CELL/2+0.2;
  const spanX=SIZE_X*CELL+0.6, spanZ=SIZE_Z*CELL+0.6;
  addWall(0,-edgeZ,spanX,0.5);addWall(-edgeX,0,0.5,spanZ);addWall(edgeX,0,0.5,spanZ);
  addWall(-CELL*1.2,edgeZ,spanX-CELL*2,0.5);
  exitPos={x:HALF_X*CELL,z:HALF_Z*CELL};
}

function createCountryFlag(country){
  const div=document.createElement("div");

  div.textContent=country.emoji;
  div.style.position="absolute";
  div.style.pointerEvents="none";
  div.style.zIndex="20";
  div.style.fontSize="60px";
  div.style.lineHeight="1";
  div.style.width="auto";
  div.style.height="auto";
  div.style.transform="translate(-50%,-50%)";
  div.style.textShadow="0 2px 5px rgba(0,0,0,.9)";
  div.dataset.countryCode=country.code;
  div.dataset.countryName=country.name;

  return div;
}

function removeCountryFlag(m){
  const flag=m && m.userData ? m.userData.countryFlag : null;
  if(!flag) return;

  if(flag.parentNode){
    flag.parentNode.removeChild(flag);
  }

  m.userData.countryFlag=null;
}

function updateCountryFlags(){
  for(const m of marbles){
    const flag=m.userData && m.userData.countryFlag;
    if(!flag) continue;

    const v=m.position.clone();
    v.y += 4.2;

    v.project(camera);

    const x=(v.x * 0.5 + 0.5) * window.innerWidth;
    const y=(-v.y * 0.5 + 0.5) * window.innerHeight;

    flag.style.left=`${x}px`;
    flag.style.top=`${y}px`;

    flag.style.display=
      (m.userData.finished ||
       m.userData.eliminated ||
       m.userData.isTeleporting)
      ? "none"
      : "block";
  }
}

function assignRandomCountry(m){
  removeCountryFlag(m);

  const country=
    COUNTRY_FLAGS[
      Math.floor(Math.random()*COUNTRY_FLAGS.length)
    ];

  const flag=createCountryFlag(country);

  document.body.appendChild(flag);

  m.userData.countryCode=country.code;
  m.userData.countryName=country.name;
  m.userData.countryEmoji=country.emoji;
  m.userData.countryFlag=flag;
}

function makeMarble(color, id, cloneId = 0){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(RADIUS,32,24),
    new THREE.MeshStandardMaterial({color,roughness:0.2,metalness:0.25,emissive:color,emissiveIntensity:0.18})
  );
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  
  const root=new THREE.Group();
  root.add(mesh);
  root.userData={
    id,
    cloneId,
    vx:0,
    vz:0,
    finished:false,
    eliminated:false,
    isTeleporting:false,
    teleportPhase:'none',
    crowdTime:0,
    isCrowding:false,
    boostCooldown:0,
    boostTime:0
  };
  assignRandomCountry(root);
  return root;
}

function respawnMarble(m, i){
  const startCellX = 1, startCellZ = 1;
  const baseX = (startCellX - HALF_X) * CELL, baseZ = (startCellZ - HALF_Z) * CELL;
  const gap = 1.85, offsets = [[-gap, -gap], [gap, -gap], [-gap, gap], [gap, gap]];
  const [ox, oz] = offsets[i % 4];

  m.scale.set(1, 1, 1);
  m.userData.isTeleporting = false;
  m.userData.teleportPhase = 'none';
  m.userData.crowdTime = 0;
  m.userData.isCrowding = false;
  m.userData.boostCooldown = 0;
  m.position.set(baseX + ox + (m.userData.cloneId * 0.4), RADIUS + 0.05, baseZ + oz + (m.userData.cloneId * 0.4));
  m.userData.vx = 0; m.userData.vz = 0;
  m.userData.stuckTime = 0;
  m.userData.targetCell = {x: startCellX, z: startCellZ};
  m.userData.currentCell = {x: startCellX, z: startCellZ};
  m.userData.visited = Array.from({length: SIZE_Z}, () => Array(SIZE_X).fill(0));
  m.userData.visited[startCellZ][startCellX] = 1;
}
function resetMarbles(){
  while(marbles.length){
    const oldMarble=marbles.pop();
    removeCountryFlag(oldMarble);
    scene.remove(oldMarble);
  }
  
  // Pilih 4 warna berbeda secara acak dari 16 warna
  const roundColors = [...COLORS]
    .sort(() => Math.random() - 0.5)
    .slice(0, 4);

  for(let i=0; i<4; i++){
    const m = makeMarble(roundColors[i], i, 0);
    m.userData.speed = 0.20 + Math.random() * 0.04;
    m.userData.randomFactor = Math.random() * 5;
    scene.add(m);
    marbles.push(m);
    respawnMarble(m, i);
    m.userData.lastX = m.position.x; m.userData.lastZ = m.position.z;
  }
  updateUI();
}

function updateUI(){
  const box=document.getElementById('players');
  box.innerHTML='';

  const visibleMarbles=marbles.filter(
    m => !m.userData.eliminated
  );

  visibleMarbles.forEach((m)=>{
    const div=document.createElement('div');
    div.className='player';

    const emoji=m.userData.countryEmoji || '🏳️';
    const name=m.userData.countryName || 'Unknown Country';

    div.innerHTML=`

  });
}

function playFinishSFX(){
  if(!audioCtx || audioCtx.state !== 'running') return;

  const now=audioCtx.currentTime;
  const notes=[523.25,659.25,783.99,1046.5];

  notes.forEach((f,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type='sine';
    osc.frequency.setValueAtTime(f,now+i*0.07);

    gain.gain.setValueAtTime(0.001,now+i*0.07);
    gain.gain.exponentialRampToValueAtTime(
      0.28,
      now+i*0.07+0.025
    );
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now+i*0.07+0.22
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now+i*0.07);
    osc.stop(now+i*0.07+0.24);
  });
}

function createFinishEffect(x,z,colorHex=0xffd166){

  playFinishSFX();

  const group=new THREE.Group();
  group.position.set(x,0,z);
  scene.add(group);

  // Flash kemenangan
  const flash=new THREE.Mesh(
    new THREE.CircleGeometry(1.2,32),
    new THREE.MeshBasicMaterial({
      color:colorHex,
      transparent:true,
      opacity:0.95,
      side:THREE.DoubleSide
    })
  );

  flash.rotation.x=-Math.PI/2;
  flash.position.y=0.12;
  group.add(flash);

  // Ring utama
  const ring=new THREE.Mesh(
    new THREE.RingGeometry(0.25,0.65,32),
    new THREE.MeshBasicMaterial({
      color:colorHex,
      transparent:true,
      opacity:1,
      side:THREE.DoubleSide
    })
  );

  ring.rotation.x=-Math.PI/2;
  ring.position.y=0.15;
  group.add(ring);

  // Partikel kemenangan
  const particleCount=18;
  const particles=[];

  for(let i=0;i<particleCount;i++){

    const particle=new THREE.Mesh(
      new THREE.SphereGeometry(0.10,8,8),
      new THREE.MeshBasicMaterial({
        color:i%2===0 ? colorHex : 0xffffff,
        transparent:true,
        opacity:1
      })
    );

    particle.position.set(0,0.35,0);

    particle.userData={
      vx:(Math.random()-0.5)*0.20,
      vy:0.08+Math.random()*0.14,
      vz:(Math.random()-0.5)*0.20
    };

    group.add(particle);
    particles.push(particle);
  }

  let life=0;

  function animateFinish(){

    life+=0.035;

    const scale=0.8+life*2.8;

    flash.scale.set(scale,scale,scale);
    ring.scale.set(scale*1.7,scale*1.7,scale*1.7);

    flash.material.opacity=Math.max(0,0.95-life*1.8);
    ring.material.opacity=Math.max(0,1-life*1.35);

    for(const particle of particles){
      particle.position.x+=particle.userData.vx;
      particle.position.y+=particle.userData.vy;
      particle.position.z+=particle.userData.vz;

      particle.userData.vy-=0.006;
      particle.rotation.x+=0.15;
      particle.rotation.z+=0.12;

      particle.material.opacity=Math.max(0,1-life*1.25);
    }

    if(life<0.85){
      requestAnimationFrame(animateFinish);
    }else{
      scene.remove(group);

      flash.geometry.dispose();
      ring.geometry.dispose();

      flash.material.dispose();
      ring.material.dispose();

      particles.forEach(p=>{
        p.geometry.dispose();
        p.material.dispose();
      });
    }
  }

  requestAnimationFrame(animateFinish);
}

function collide(m){
  const r=RADIUS;
  for(const w of walls){
    const nx=Math.max(w.x-w.hw,Math.min(m.position.x,w.x+w.hw));
    const nz=Math.max(w.z-w.hd,Math.min(m.position.z,w.z+w.hd));
    let dx=m.position.x-nx,dz=m.position.z-nz,dist=Math.hypot(dx,dz);
    if(dist<r&&dist>1e-6){
      const nxx=dx/dist,nzz=dz/dist,pen=r-dist;
      m.position.x+=nxx*pen;m.position.z+=nzz*pen;
      const dot=m.userData.vx*nxx+m.userData.vz*nzz;
      if(dot<0){
        m.userData.vx-=1.95*dot*nxx;m.userData.vz-=1.95*dot*nzz;
        if(Math.abs(dot) > 0.04) playHitSFX(0.12);
      }
      m.userData.vx*=0.88;m.userData.vz*=0.88;
    }
  }
}

function separate(dt = 0.016){
  marbles.forEach(m => m.userData.isCrowding = false);

  for(let i=0;i<marbles.length;i++) for(let j=i+1;j<marbles.length;j++){
    const a=marbles[i],b=marbles[j];
    if(a.userData.finished || b.userData.finished || a.userData.eliminated || b.userData.eliminated || a.userData.isTeleporting || b.userData.isTeleporting) continue;
    let dx=b.position.x-a.position.x,dz=b.position.z-a.position.z,d=Math.hypot(dx,dz);
    const minD=RADIUS*2.4;
    
    if(d<minD){
      a.userData.isCrowding = true;
      b.userData.isCrowding = true;
      playHitSFX(0.18);

      const newTime = Math.max(a.userData.crowdTime || 0, b.userData.crowdTime || 0) + dt;
      a.userData.crowdTime = newTime;
      b.userData.crowdTime = newTime;

      if(newTime >= 7.0){
        const victim = Math.random() < 0.5 ? a : b;
        victim.userData.finished = true;
        victim.userData.eliminated = true;
        victim.visible = false;
        createExplosion(victim.position.x, victim.position.z);
        const victimName = victim.userData.countryName || 'Unknown Country' + (victim.userData.cloneId > 0 ? ` (Clone ${victim.userData.cloneId})` : '');
        document.getElementById('status').textContent = `💥 COLLISION! ${victimName} exploded after being stuck for 7 seconds!`;
        a.userData.crowdTime = 0;
        b.userData.crowdTime = 0;
        updateUI();
        continue;
      }

      if(d > 1e-6){
        const nx=dx/d,nz=dz/d,p=(RADIUS*2.1-d)*0.5;
        if(p > 0){
          a.position.x-=nx*p;a.position.z-=nz*p;
          b.position.x+=nx*p;b.position.z+=nz*p;
        }
        const pushForce = 0.12;
        a.userData.vx -= nx * pushForce; a.userData.vz -= nz * pushForce;
        b.userData.vx += nx * pushForce; b.userData.vz += nz * pushForce;
      }
    }
  }

  marbles.forEach(m => {
    if(!m.userData.isCrowding && m.userData.crowdTime > 0){
      m.userData.crowdTime = Math.max(0, m.userData.crowdTime - dt * 1.5);
    }
  });
}

function steer(m){
  if(m.userData.finished || m.userData.eliminated || m.userData.isTeleporting) return;
  const gx = Math.max(0, Math.min(SIZE_X - 1, Math.round(m.position.x / CELL + HALF_X)));
  const gz = Math.max(0, Math.min(SIZE_Z - 1, Math.round(m.position.z / CELL + HALF_Z)));

  const targetWorldX = (m.userData.targetCell.x - HALF_X) * CELL;
  const targetWorldZ = (m.userData.targetCell.z - HALF_Z) * CELL;
  const distToTarget = Math.hypot(m.position.x - targetWorldX, m.position.z - targetWorldZ);

  if(distToTarget < 0.75 || (gx !== m.userData.currentCell.x || gz !== m.userData.currentCell.z)){
    m.userData.currentCell = {x: gx, z: gz};
    const dirs = [[0,-1],[1,0],[0,1],[-1,0]], validMoves = [];

    for(let i = 0; i < 4; i++){
      if(!cells[gz][gx].w[i]){
        const nx = gx + dirs[i][0], nz = gz + dirs[i][1];
        if(nx >= 0 && nx < SIZE_X && nz >= 0 && nz < SIZE_Z){
          const visits = m.userData.visited[nz][nx];
          const distToExit = Math.hypot(nx - (SIZE_X - 1), nz - (SIZE_Z - 1));
          const score = visits * 100 + distToExit + (Math.random() * m.userData.randomFactor);
          validMoves.push({x: nx, z: nz, score, visits});
        }
      }
    }

    if(validMoves.length > 0){
      validMoves.sort((a, b) => a.score - b.score);
      const chosen = validMoves[0];
      m.userData.targetCell = {x: chosen.x, z: chosen.z};
      m.userData.visited[chosen.z][chosen.x] += 1;
    }
  }

  const tx = (m.userData.targetCell.x - HALF_X) * CELL, tz = (m.userData.targetCell.z - HALF_Z) * CELL;
  const dx = tx - m.position.x, dz = tz - m.position.z;
  const len = Math.hypot(dx, dz) || 1;

  const boostMultiplier = (m.userData.boostTime > 0) ? 1.45 : 1.0;
  const currentSpeed = m.userData.speed * boostMultiplier;

  m.userData.vx = THREE.MathUtils.lerp(
    m.userData.vx,
    (dx / len) * currentSpeed,
    0.85
  );

  m.userData.vz = THREE.MathUtils.lerp(
    m.userData.vz,
    (dz / len) * currentSpeed,
    0.85
  );
}

// PERBAIKAN: Kamera Zoom In & Mengikuti Marble HANYA ketika mendekati garis exit sampai keluar
function updateCamera(){
  camera.position.set(0, 74, 0);
  camera.lookAt(0, 0, 0);
}

function startRound(){
  startRollingAudio();
  winner=false;elapsed=0;
  document.getElementById('round').textContent=round;
  document.getElementById('message').classList.remove('show');
  generateMaze();
  resetMarbles();
  document.getElementById('status').textContent=trapMultiplier > 1 ? `MARBLE RACE STARTED! (Traps ${trapMultiplier}x)` : 'MARBLE RACE STARTED!';
}

function update(dt = 0.016){
  if(winner) {
    stopRollingAudio();
    return;
}

  updateCountryFlags();



  traps.forEach(t => {
    if(t.type === 'bomb' && t.active && t.body){
      t.body.material.emissiveIntensity = 0.5 + Math.sin(performance.now() * 0.008) * 0.4;
    } else if(t.type === 'hole_blue' && t.active && t.ring){
      t.ring.rotation.z += 0.08;
    }
  });

  stars.forEach(s => {
    if(s.active && s.mesh){
      s.mesh.rotation.y += 0.05;
      s.mesh.position.y = 0.8 + Math.sin(performance.now() * 0.006) * 0.2;
    }
  });

  boosts.forEach(b => {
    if(b.arrow){
      b.arrow.position.y = 0.05 + Math.sin(performance.now() * 0.01) * 0.03;
    }
  });

  for(const m of [...marbles]){
    if(m.userData.finished || m.userData.eliminated) continue;

    if(m.userData.boostCooldown > 0){
      m.userData.boostCooldown -= dt;
    }

    // BOOST TIMER
    if(m.userData.boostTime > 0){
      m.userData.boostTime -= dt;

      if(m.userData.boostTime <= 0){
        m.userData.boostTime = 0;
      }
    }

    if(m.userData.isTeleporting){
      if(m.userData.teleportPhase === 'in'){
        m.userData.teleportProgress = (m.userData.teleportProgress || 0) + 0.20;
        const p = m.userData.teleportProgress;
        m.position.x = THREE.MathUtils.lerp(m.position.x, m.userData.targetHole.x, 0.45);
        m.position.z = THREE.MathUtils.lerp(m.position.z, m.userData.targetHole.z, 0.45);
        const s = Math.max(0.01, 1 - p);
        m.scale.set(s, s, s);

        if(p >= 1.0){
          const rx = Math.floor(Math.random() * SIZE_X);
          const rz = Math.floor(Math.random() * SIZE_Z);
          const destX = (rx - HALF_X) * CELL;
          const destZ = (rz - HALF_Z) * CELL;

          m.position.set(destX, RADIUS + 0.05, destZ);
          createHolePulse(destX, destZ, 0x00c8ff);
          playPortalSFX();
          m.userData.teleportPhase = 'out';
          m.userData.teleportProgress = 0;
          m.userData.currentCell = {x: rx, z: rz};
          m.userData.targetCell = {x: rx, z: rz};
        }
      } else if(m.userData.teleportPhase === 'out'){
        m.userData.teleportProgress = (m.userData.teleportProgress || 0) + 0.20;
        const p = m.userData.teleportProgress;
        const s = Math.min(1.0, p);
        m.scale.set(s, s, s);

        if(p >= 1.0){
          m.scale.set(1, 1, 1);
          m.userData.isTeleporting = false;
          m.userData.teleportPhase = 'none';
          m.userData.vx = (Math.random() - 0.5) * 0.4;
          m.userData.vz = (Math.random() - 0.5) * 0.4;
        }
      }
      continue;
    }

    const moved = Math.hypot(m.position.x - m.userData.lastX, m.position.z - m.userData.lastZ);
    m.userData.lastX = m.position.x; m.userData.lastZ = m.position.z;

    if(moved < 0.02){
      m.userData.stuckTime = (m.userData.stuckTime || 0) + 1;
      if(m.userData.stuckTime > 8){
        m.userData.vx += (Math.random() - 0.5) * 0.5;
        m.userData.vz += (Math.random() - 0.5) * 0.5;
      }
    } else {
      m.userData.stuckTime = Math.max(0, (m.userData.stuckTime || 0) - 1);
    }

    steer(m);
    // Gerakan dibuat berbasis waktu agar tidak terlalu cepat
    // ketika FPS perangkat tinggi.
    const frameScale = Math.min(dt * 60, 1.5);

    m.position.x += m.userData.vx * frameScale;
    m.position.z += m.userData.vz * frameScale;

    m.userData.vx *= Math.pow(0.985, frameScale);
    m.userData.vz *= Math.pow(0.985, frameScale);
    collide(m);
    m.rotation.x+=m.userData.vz*4.8;m.rotation.z-=m.userData.vx*4.8;

    for(const b of boosts){
      const dist = Math.hypot(m.position.x - b.x, m.position.z - b.z);
      if(dist < 1.1 && (!m.userData.boostCooldown || m.userData.boostCooldown <= 0)){
        m.userData.boostCooldown = 1.2;
        const dirX = m.userData.vx || (Math.random() - 0.5);
        const dirZ = m.userData.vz || (Math.random() - 0.5);
        const len = Math.hypot(dirX, dirZ) || 1;

        m.userData.vx += (dirX / len) * 0.95;
        m.userData.vz += (dirZ / len) * 0.95;
        createBoostEffect(b.x, b.z);
        document.getElementById('status').textContent = `⚡ SPEED BOOST! ${m.userData.countryName || 'Unknown Country'} is speeding!`;
        break;
      }
    }

    for(const s of stars){
      if(!s.active) continue;
      const dist = Math.hypot(m.position.x - s.x, m.position.z - s.z);
      if(dist < 1.35){
        s.active = false;
        starGroup.remove(s.mesh);
        createStarEffect(s.x, s.z);

        const colorId = m.userData.id;
        const currentClones = marbles.filter(item => item.userData.id === colorId && !item.userData.eliminated).length;

        if(currentClones <= 3){
          const newCloneId = marbles.filter(item => item.userData.id === colorId).length;
          const cloneColor = COLORS[Math.floor(Math.random() * COLORS.length)];
          const cloneMesh = makeMarble(cloneColor, colorId, newCloneId);
          assignRandomCountry(cloneMesh);
          cloneMesh.userData.speed = m.userData.speed;
          cloneMesh.userData.randomFactor = m.userData.randomFactor;
          scene.add(cloneMesh);
          marbles.push(cloneMesh);
          respawnMarble(cloneMesh, colorId);
          document.getElementById('status').textContent = `★ STAR! ${m.userData.countryName || 'Unknown Country'} created a clone (${currentClones}/3)!`;
        } else {
          document.getElementById('status').textContent = `★ ${m.userData.countryName || 'Unknown Country'} found a star (clone limit reached)`;
        }
        updateUI();
        break;
      }
    }

    // =========================================================
    // BOOST PAD COLLISION
    // =========================================================
    for(const b of boosts){
      if(!b || !b.mesh) continue;

      const distBoost = Math.hypot(
        m.position.x - b.x,
        m.position.z - b.z
      );

      if(distBoost < CELL * 0.42 && m.userData.boostCooldown <= 0){

        m.userData.boostTime = 2.0;
        m.userData.boostCooldown = 2.5;

        createBoostEffect(b.x, b.z);

        document.getElementById('status').textContent =
          `⚡ SPEED BOOST! ${m.userData.countryName || 'Unknown Country'} is speeding!`;

        break;
      }
    }

    for(const t of traps){
      if(!t.active) continue;
      const dist = Math.hypot(m.position.x - t.x, m.position.z - t.z);
      if(dist < 1.3){
        if(t.type === 'bomb' && dist < 1.1){
          const countryName = m.userData.countryName || 'Unknown Country';

          // 1. Create explosion BEFORE hiding/removing the marble and bomb


          createExplosion(t.x, t.z);



          // 2. Eliminate the marble


          m.userData.finished = true;


          m.userData.eliminated = true;


          m.visible = false;



          // 3. Consume the bomb immediately


          t.active = false;



          if(t.mesh){


            t.mesh.visible = false;


            trapGroup.remove(t.mesh);


          }



          // 4. Clear camera target if necessary


          if(activeTargetMarble === m){


            activeTargetMarble = null;


          }

          // 5. English event message
          document.getElementById('status').textContent =
            `💥 ${countryName} hit a bomb and was eliminated!`;

          updateUI();
                } else if(t.type === 'hole_blue'){
          playPortalSFX();
          m.userData.isTeleporting = true;
          m.userData.teleportPhase = 'in';
          m.userData.teleportProgress = 0;
          m.userData.targetHole = {x: t.x, z: t.z};
          createHolePulse(t.x, t.z, 0x00c8ff);
          document.getElementById('status').textContent = `🌀 PORTAL! ${m.userData.countryName || 'Unknown Country'} was teleported!`;
        }
        break;
      }
    }

    if(!m.userData.finished && !m.userData.eliminated && Math.hypot(m.position.x-exitPos.x, m.position.z-exitPos.z) < RADIUS + 0.45){
      createFinishEffect(
        m.position.x,
        m.position.z,
        COLORS[m.userData.id % COLORS.length]
      );

      m.userData.finished=true;winner=true;
      trapMultiplier = 1;
      document.getElementById('winner').textContent=m.userData.countryName || 'Unknown Country' + (m.userData.cloneId > 0 ? ` (Clone ${m.userData.cloneId})` : '') + ' WINS!!';
      document.getElementById('status').textContent=m.userData.countryName || 'Unknown Country'+' escaped!!';
      document.getElementById('message').classList.add('show');
      setTimeout(()=>{round++;startRound();},3500);break;
    }
  }

  const allEliminated = marbles.every(m => m.userData.eliminated);
  if(allEliminated && !winner){
    winner = true;
    trapMultiplier = 1;
    document.getElementById('winner').textContent = 'ALL MARBLES EXPLODED!';
    document.getElementById('status').textContent = 'All marbles were eliminated! Restarting round...';
    document.getElementById('message').classList.add('show');
    setTimeout(()=>{ round++; startRound(); }, 3500);
  }

  if(elapsed >= 180 && !winner){
    winner = true;
    trapMultiplier *= 2;
    document.getElementById('winner').textContent = "TIME'S UP!";
    document.getElementById('status').textContent = `3-minute time limit reached! Traps doubled (${trapMultiplier}x)...`;
    document.getElementById('message').classList.add('show');
    setTimeout(()=>{ round++; startRound(); }, 3500);
  }

  separate(dt);
  updateCamera();
  if(++tick%12===0) updateUI();
}

function animate(t){
  requestAnimationFrame(animate);
  let dt = (t - last) / 1000;
  if(dt > 0.1) dt = 0.016;
  if(!winner) elapsed += dt;
  last = t;
  document.getElementById('timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
  update(dt);
  renderer.render(scene,camera);
}

startRound(); requestAnimationFrame(animate);
addEventListener('resize',()=>{
  const asp = innerWidth / innerHeight;
  camera.aspect = asp;
  camera.fov = asp < 1 ? 64 : 44;
  baseCamPos.y = 74;
  baseCamPos.z = 0;
  camera.updatePolyMatrix ? camera.updatePolyMatrix() : camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
