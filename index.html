<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin Dice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#0a0e1a;color:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.3) 50%,rgba(0,0,0,.65));z-index:1;pointer-events:none}
#app{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 12px;gap:8px}
.title{font-size:clamp(26px,6vw,42px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#ffd700,#ff6b00,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px #000)}
.sub{font-size:12px;color:#a0d8ff;letter-spacing:1px;margin-top:2px}
.badge{display:inline-block;margin-top:6px;padding:5px 14px;background:rgba(0,30,60,.9);border:2px solid #00c9ee;border-radius:24px;font-size:14px;font-weight:800;color:#00e5ff}
.timer{color:#ffeb3b;margin-left:6px;font-size:18px}
#players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:900px}
.card{background:rgba(8,16,32,.9);border:3px solid #1a3a5c;border-radius:12px;padding:8px 6px;text-align:center;transition:.3s}
.card.human{border-color:#00c9ee;box-shadow:0 0 14px rgba(0,200,255,.3)}
.card.winner{border-color:#ffd700;box-shadow:0 0 24px rgba(255,215,0,.5);transform:scale(1.06);z-index:5}
.card.low{opacity:.5}
.name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e0f0ff;margin-bottom:4px}
.card.human .name{color:#00e5ff}
.dice{width:72px;height:72px;margin:0 auto 4px;background:linear-gradient(145deg,#fff,#ddd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#1a1a2e;box-shadow:0 3px 10px #000}
.dice.empty{background:linear-gradient(145deg,#2a3a4a,#1a2a3a);color:#4a6a8a;font-size:18px}
.dice.roll{animation:sh .15s infinite;background:linear-gradient(145deg,#ffe066,#ffcc00)!important;box-shadow:0 0 16px rgba(255,200,0,.75)}
@keyframes sh{0%{transform:rotate(-20deg) scale(1.15)}25%{transform:rotate(20deg) scale(1.2)}50%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(1.18)}100%{transform:rotate(-20deg) scale(1.15)}}
.tag{font-size:9px;font-weight:700;color:#7a9ab0;text-transform:uppercase}
.card.human .tag{color:#00c9ee}
#boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:480px}
.box{aspect-ratio:1;background:rgba(10,25,50,.9);border:3px solid #2a5a8a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,26px);font-weight:900;color:#7ec8ff;transition:.2s;position:relative}
.box.on{background:linear-gradient(145deg,#00a8e8,#0066aa);border-color:#00e5ff;color:#fff;box-shadow:0 0 12px rgba(0,200,255,.5);transform:scale(1.08)}
.box.on::after{content:attr(data-o);position:absolute;bottom:0;left:0;right:0;font-size:7px;background:rgba(0,0,0,.5);padding:1px;border-radius:0 0 8px 8px}
.hint{font-size:12px;color:#b0d0f0;background:rgba(0,20,40,.75);padding:5px 12px;border-radius:16px;border:1px solid #1a4a6a}
.hint b{color:#ffd700}
#wheel-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.ww{position:relative;width:min(600px,92vw);height:min(600px,92vw)}
#wheel{width:100%;height:100%;border-radius:50%;filter:drop-shadow(0 6px 20px #000)}
#wheel.spin{transition:transform 5.5s cubic-bezier(.15,.85,.25,1)}
#ptr{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:90px;height:90px;z-index:10;filter:drop-shadow(0 3px 6px #000)}
.wlabel{margin-top:10px;font-size:16px;font-weight:800;color:#ffd700;min-height:24px;text-align:center}
#side{position:fixed;bottom:8px;left:8px;right:8px;display:flex;gap:8px;z-index:20;pointer-events:none}
.panel{flex:1;background:rgba(5,12,25,.9);border:1px solid #1a3a5c;border-radius:8px;padding:6px 8px;max-height:80px;overflow:hidden}
.pt{font-size:9px;font-weight:800;color:#00c9ee;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.pl{font-size:11px;font-weight:700;color:#c0d8f0;line-height:1.35}
.pe{color:#5a7a9a;font-style:italic;font-size:10px}
#pop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#pop.show{display:flex}
.pc{background:linear-gradient(160deg,#0d2137,#1a3a5c);border:3px solid #ffd700;border-radius:16px;padding:24px 32px;text-align:center;max-width:90%;box-shadow:0 0 40px rgba(255,200,0,.35)}
.pt2{font-size:12px;color:#a0d8ff;letter-spacing:2px;text-transform:uppercase}
.pw{font-size:24px;font-weight:900;color:#ffd700;margin:6px 0}
.pp{font-size:32px;font-weight:900;color:#fff}
</style>
</head>
<body>
<img id="bg" src="assets/bg.png" alt="">
<div class="overlay"></div>
<div id="app">
<header style="text-align:center;width:100%">
<div class="title">SPIN DICE</div>
<div class="sub">HIGHEST NUMBER WINS • SPIN THE WHEEL</div>
<div class="badge"><span id="ph">MENUNGGU...</span><span class="timer" id="tm"></span></div>
</header>
<div id="players"></div>
<div style="text-align:center;width:100%;max-width:480px">
<div style="font-size:11px;font-weight:800;color:#a0d8ff;letter-spacing:1px;margin-bottom:6px">PILIHAN ANGKA (KETIK 1-6 DI CHAT)</div>
<div id="boxes">
<div class="box" data-n="1">1</div><div class="box" data-n="2">2</div><div class="box" data-n="3">3</div>
<div class="box" data-n="4">4</div><div class="box" data-n="5">5</div><div class="box" data-n="6">6</div>
</div>
</div>
<div class="hint">Ketik <b>join</b> untuk ikut • Ketik <b>1-6</b> untuk pilih angka</div>
<div id="wheel-area">
<div class="ww">
<img id="wheel" src="assets/wheel.png" alt="w">
<img id="ptr" src="assets/pointer.png" alt="p">
</div>
<div class="wlabel" id="wl"></div>
</div>
</div>
<div id="side">
<div class="panel"><div class="pt">Pemain Aktif</div><div class="pl" id="al"><span class="pe">Bot main</span></div></div>
<div class="panel"><div class="pt">Antrean</div><div class="pl" id="ql"><span class="pe">Kosong</span></div></div>
</div>
<div id="pop"><div class="pc"><div class="pt2">PEMENANG</div><div class="pw" id="popw">-</div><div class="pp" id="popp">-</div></div></div>
<audio id="s1" src="assets/sounds/spin.wav" preload="auto"></audio>
<audio id="s2" src="assets/sounds/result.wav" preload="auto"></audio>
<audio id="s3" src="assets/sounds/win.mp3" preload="auto"></audio>
<audio id="s4" src="assets/sounds/jackpot.wav" preload="auto"></audio>
<script>
const NAME_POOL=["Raka","Sinta","Budi","Dewi","Andi","Putri","Fajar","Nina","Rizky","Maya","Dimas","Ayu","Gilang","Lestari","Yoga","Intan","Hendra","Wulan","Agus","Citra","Bayu","Sari"];function pickBotNames(n){const a=NAME_POOL.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}let DN=pickBotNames(4),MP=4,CS=12,RS=4,SD=5500,RSH=5000;
const PR=["ZONK","Hadiah Kecil","Ulang Lagi","Hadiah Sedang","JACKPOT","Hadiah Kecil","ZONK","Hadiah Besar"],SG=PR.length;
let phase="idle",pt=0,players=[],chatA=[],chatQ=[],rid=1,rotSent=false,wAng=0,winI=-1,lastC={};
const pEl=document.getElementById("players"),ph=document.getElementById("ph"),tm=document.getElementById("tm");
const boxes=document.querySelectorAll(".box"),wh=document.getElementById("wheel"),wl=document.getElementById("wl");
const pop=document.getElementById("pop"),popw=document.getElementById("popw"),popp=document.getElementById("popp");
const al=document.getElementById("al"),ql=document.getElementById("ql");
const s1=document.getElementById("s1"),s2=document.getElementById("s2"),s3=document.getElementById("s3"),s4=document.getElementById("s4");
function sfx(a){try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function build(){
  const ns=[];
  for(let i=0;i<MP;i++){
    if(chatA[i]) ns.push({name:chatA[i].name||chatA[i].user,isH:true,ctrl:chatA[i].control,cid:+(chatA[i].controlId||0)});
    else ns.push({name:DN[i],isH:false,ctrl:null,cid:0});
  }
  const om={};players.forEach(p=>om[p.name]=p);
  players=ns.map(n=>{
    let ch=om[n.name]?om[n.name].choice:null;
    if(n.isH&&n.ctrl&&n.cid){const num=+n.ctrl;if(num>=1&&num<=6){if(!lastC[n.name]||lastC[n.name]!==n.cid){ch=num;lastC[n.name]=n.cid}}}
    return {name:n.name,isH:n.isH,choice:ch,cid:n.cid};
  });
  rend();ubox();
}
function rend(){
  pEl.innerHTML=players.map((p,i)=>{
    const iw=(phase==="reveal"||phase==="spin"||phase==="result")&&i===winI;
    const il=(phase==="reveal"||phase==="spin"||phase==="result")&&winI>=0&&i!==winI&&p.choice!=null;
    let fc="dice",ft="?";
    if(phase==="choose"&&p.choice==null){fc+=" roll";ft=(p._sf||"🎲")}
    else if(p.choice!=null&&(phase!=="choose"||p.isH))ft=p.choice;
    else{fc+=" empty";ft="—"}
    if(phase==="reveal"&&p.choice!=null)ft=p.choice;
    return `<div class="card ${p.isH?"human":""} ${iw?"winner":""} \( {il?"low":""}"><div class="name"> \){esc(p.name)}</div><div class="\( {fc}"> \){ft}</div><div class="tag">${p.isH?"PENONTON":"BOT"}</div></div>`;
  }).join("");
}
function ubox(){
  const o={1:[],2:[],3:[],4:[],5:[],6:[]};
  players.forEach(p=>{if(p.choice>=1&&p.choice<=6)o[p.choice].push(p.name.split(" ")[0].slice(0,8))});
  boxes.forEach(b=>{const n=+b.dataset.n;if(o[n].length){b.classList.add("on");b.setAttribute("data-o",o[n].join(","))}else{b.classList.remove("on");b.removeAttribute("data-o")}});
}
async function load(){
  try{
    const r=await fetch("chat_state.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const st=await r.json();chatA=Array.isArray(st.active)?st.active:[];chatQ=Array.isArray(st.queue)?st.queue:[];
    al.innerHTML=chatA.length?chatA.map(p=>esc(p.name||p.user)).join("<br>"):'<span class="pe">Bot main</span>';
    ql.innerHTML=chatQ.length?chatQ.map((p,i)=>(i+1)+". "+esc(p.name||p.user)).join("<br>"):'<span class="pe">Kosong</span>';
    build();
  }catch(e){if(!players.length)build()}
}
async function sendRot(name){
  if(rotSent)return;rotSent=true;
  try{const r=await fetch("http://127.0.0.1:8765/race-result",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({raceId:String(rid),eliminated:name})});console.log("[ROT]",r.status,await r.text());setTimeout(load,800)}catch(e){console.warn(e)}
}
function setPh(p,sec){
  phase=p;pt=sec||0;
  const L={idle:"SIAP...",choose:"PILIH ANGKA!",reveal:"HASIL DADU",spin:"SPIN WHEEL!",result:"HADIAH"};
  ph.textContent=L[p]||p;tm.textContent=pt>0?pt+"s":"";
  if(p==="choose"){winI=-1;wl.textContent="";players.forEach(x=>x.choice=null);lastC={};rend();ubox();pop.classList.remove("show")}
  if(p==="reveal"){
    sfx(s2);players.forEach(x=>{if(x.choice==null)x.choice=1+Math.floor(Math.random()*6)});
    let mx=-1,c=[];players.forEach((x,i)=>{if(x.choice>mx){mx=x.choice;c=[i]}else if(x.choice===mx)c.push(i)});
    winI=c[Math.floor(Math.random()*c.length)];rend();ubox();
    wl.textContent="🏆 "+players[winI].name+" (angka "+players[winI].choice+")";
  }
  if(p==="spin")startSpin();
}
function startSpin(){
  sfx(s1);const seg=Math.floor(Math.random()*SG),prize=PR[seg];
  const sa=360/SG,ti=seg*sa+sa/2,fm=(360-ti+360)%360,sp=5+Math.floor(Math.random()*3);
  const na=wAng+sp*360+fm-(wAng%360);
  wh.classList.add("spin");wh.style.transform="rotate("+na+"deg)";wAng=na;
  setTimeout(()=>{wh.classList.remove("spin");showRes(prize)},SD+100);
}
function showRes(prize){
  const w=players[winI];popw.textContent=w?w.name:"-";popp.textContent=prize;pop.classList.add("show");
  if(prize==="JACKPOT")sfx(s4);else sfx(s3);
  wl.textContent="🏆 "+w.name+" dapat: "+prize;
  let li=-1,lv=99;players.forEach((x,i)=>{if(i===winI)return;if(x.choice<lv){lv=x.choice;li=i}});
  if(li>=0){const bl=players.map((x,i)=>({x,i})).filter(o=>o.i!==winI&&o.x.choice===lv&&!o.x.isH);if(bl.length)li=bl[0].i;sendRot(players[li].name)}
  setPh("result",Math.ceil(RSH/1000));
}
let lt=performance.now();
function tick(now){
  const dt=(now-lt)/1000;lt=now;
  if(pt>0){pt-=dt;if(pt<=0){pt=0;tm.textContent="";adv()}else tm.textContent=Math.ceil(pt)+"s"}
  if(phase==="choose"){let n=0;players.forEach(x=>{if(x.choice==null){x._sf=1+Math.floor(Math.random()*6);n=1;}if(!x.isH&&x.choice==null&&Math.random()<0.03){x.choice=1+Math.floor(Math.random()*6);n=1;}});if(n){rend();ubox();}}
  requestAnimationFrame(tick);
}
function adv(){
  if(phase==="idle"||phase==="result"){rid++;rotSent=false;setPh("choose",CS)}
  else if(phase==="choose")setPh("reveal",RS);
  else if(phase==="reveal")setPh("spin",0);
}
load();setInterval(load,2000);
setTimeout(()=>setPh("choose",CS),2000);
requestAnimationFrame(tick);
if(!players.length)build();
</script>
</body>
</html>
