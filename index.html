<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Marble Maze</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120a06;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);width:100%;text-align:center;pointer-events:none;text-shadow:0 2px 6px #000}
h1{margin:0;font-size:clamp(22px,5vw,38px);font-weight:900;letter-spacing:3px;color:#ffd166}
.sub{font-size:10px;letter-spacing:2px;color:#f5d7a0}
.badge{display:inline-block;margin-top:6px;padding:5px 14px;background:#24140ae8;border:2px solid #b9782e;border-radius:20px;font-size:12px;font-weight:bold}
#timer{color:#ffe45c;margin-left:8px}
#players{position:fixed;z-index:6;top:10px;right:8px;display:flex;flex-direction:column;gap:5px}
.player{min-width:72px;padding:6px;background:#21130be8;border:2px solid #6d4525;border-radius:9px;text-align:center;font-size:10px;font-weight:700}
.player.lead{border-color:#ffd166}
.dot{width:16px;height:16px;border-radius:50%;margin:0 auto 3px}
#status{position:fixed;z-index:6;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 14px;background:#21130be8;border:1px solid #87582d;border-radius:20px;font-size:11px}
#message{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;background:#0009}
#message.show{display:flex}
.messageBox{padding:25px 35px;text-align:center;background:linear-gradient(145deg,#3b210d,#160d07);border:3px solid #e9ae45;border-radius:18px}
.messageBox h2{margin:5px 0;color:#ffd166;font-size:28px}
</style></head><body>
<div id="game"></div>
<div id="hud"><h1>MARBLE MAZE</h1><div class="sub">4 MARBLE BERWARNA</div>
<div class="badge">RONDE <span id="round">1</span> <span id="timer">00:00</span></div></div>
<div id="players"></div>
<div id="status">Menyiapkan...</div>
<div id="message"><div class="messageBox"><small>PEMENANG</small><h2 id="winner">—</h2></div></div>
<audio id="rollingSound" src="assets/sound/marble-rolling.mp3" preload="auto" loop></audio>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const COLORS=[0xff2244,0x2288ff,0x22dd66,0xffdd00];
const NAMES=['MERAH','BIRU','HIJAU','KUNING'];
const RADIUS=0.95;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1008);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,150);
camera.position.set(0,48,20);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe6c0,0x3a2010,1.8));
const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-14,30,12);sun.castShadow=true;scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.4));

const board=new THREE.Mesh(new THREE.BoxGeometry(36,0.5,36),new THREE.MeshStandardMaterial({color:0xd2a679,roughness:0.85}));
board.position.y=-0.3;board.receiveShadow=true;scene.add(board);

const maze=new THREE.Group();scene.add(maze);
const walls=[];
const CELL=2.6,SIZE=11,HALF=(SIZE-1)/2;
const wallMat=new THREE.MeshStandardMaterial({color:0x1a0e06,roughness:0.4});

function addWall(x,z,w,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.8,d),wallMat);
  m.position.set(x,1.2,z);m.castShadow=true;maze.add(m);
  walls.push({x,z,w,d,hw:w/2,hd:d/2});
}

let exitPos={x:0,z:0},finishMesh=null;

function generateMaze(){
  while(maze.children.length) maze.remove(maze.children[0]);
  walls.length=0;
  const cells=[];
  for(let z=0;z<SIZE;z++){cells[z]=[];for(let x=0;x<SIZE;x++) cells[z][x]={v:false,w:[true,true,true,true]};}
  const dirs=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
  function carve(x,z){
    cells[z][x].v=true;
    for(const di of [0,1,2,3].sort(()=>Math.random()-0.5)){
      const nx=x+dirs[di][0],nz=z+dirs[di][1];
      if(nx>=0&&nx<SIZE&&nz>=0&&nz<SIZE&&!cells[nz][nx].v){
        cells[z][x].w[dirs[di][2]]=false;cells[nz][nx].w[dirs[di][3]]=false;carve(nx,nz);
      }
    }
  }
  carve(0,0);
  for(const [x,z] of [[0,0],[1,0],[0,1],[1,1]]){
    if(x+1<SIZE){cells[z][x].w[1]=false;cells[z][x+1].w[3]=false;}
    if(z+1<SIZE){cells[z][x].w[2]=false;cells[z+1][x].w[0]=false;}
  }

  for(let z=0;z<SIZE;z++) for(let x=0;x<SIZE;x++){
    const c=cells[z][x],px=(x-HALF)*CELL,pz=(z-HALF)*CELL;
    if(c.w[0]) addWall(px,pz-CELL/2,CELL+0.25,0.4);
    if(c.w[1]) addWall(px+CELL/2,pz,0.4,CELL+0.25);
    if(c.w[2]&&!(x===SIZE-1&&z===SIZE-1)) addWall(px,pz+CELL/2,CELL+0.25,0.4);
    if(c.w[3]) addWall(px-CELL/2,pz,0.4,CELL+0.25);
  }
  const edge=HALF*CELL+CELL/2+0.2,span=SIZE*CELL+0.6;
  addWall(0,-edge,span,0.5);addWall(-edge,0,0.5,span);addWall(edge,0,0.5,span);
  addWall(-CELL*1.2,edge,span-CELL*2,0.5);
  exitPos={x:HALF*CELL,z:HALF*CELL};
  if(!finishMesh){
    finishMesh=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,0.12,32),
      new THREE.MeshStandardMaterial({color:0xffd43b,emissive:0x8a5a00,emissiveIntensity:1.4}));
    scene.add(finishMesh);
  }
  finishMesh.position.set(exitPos.x,0.08,exitPos.z);
}

const marbles=[];

function makeMarble(color,id){
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS,32,24),
    new THREE.MeshStandardMaterial({color,roughness:0.2,metalness:0.25,emissive:color,emissiveIntensity:0.18})
  );
  mesh.castShadow=true;
  const outline=new THREE.Mesh(new THREE.SphereGeometry(RADIUS*1.06,20,14),
    new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide}));
  const root=new THREE.Group();
  root.add(outline);root.add(mesh);
  root.userData={id,vx:0,vz:0,finished:false,stuck:0};
  return root;
}

function createAllMarbles(){
  while(marbles.length){scene.remove(marbles.pop());}
  for(let i=0;i<4;i++){const m=makeMarble(COLORS[i],i);scene.add(m);marbles.push(m);}
}

function resetMarbles(){
  const baseX=(0-HALF)*CELL, baseZ=(0-HALF)*CELL, gap=RADIUS*2.15;
  const offsets=[[-gap*0.5,-gap*0.5],[gap*0.5,-gap*0.5],[-gap*0.5,gap*0.5],[gap*0.5,gap*0.5]];
  marbles.forEach((m,i)=>{
    const [ox,oz]=offsets[i];
    m.position.set(baseX+ox, RADIUS+0.05, baseZ+oz);
    m.rotation.set(0,0,0); m.visible=true;
    m.userData.vx=0; m.userData.vz=0;
    m.userData.finished=false; m.userData.stuck=0;
  });
  updateUI();
}

function updateUI(){
  const box=document.getElementById('players');box.innerHTML='';
  [...marbles].map((m,i)=>({i,d:Math.hypot(m.position.x-exitPos.x,m.position.z-exitPos.z)}))
    .sort((a,b)=>a.d-b.d).forEach((r,place)=>{
      const div=document.createElement('div');
      div.className='player'+(place===0?' lead':'');
      div.innerHTML=`<div class="dot" style="background:#\( {COLORS[r.i].toString(16).padStart(6,'0')}"></div> \){NAMES[r.i]}`;
      box.appendChild(div);
    });
}

function collide(m){
  const r=RADIUS;
  for(const w of walls){
    const nx=Math.max(w.x-w.hw,Math.min(m.position.x,w.x+w.hw));
    const nz=Math.max(w.z-w.hd,Math.min(m.position.z,w.z+w.hd));
    let dx=m.position.x-nx,dz=m.position.z-nz,dist=Math.hypot(dx,dz);
    if(dist<r&&dist>1e-6){
      const nxx=dx/dist,nzz=dz/dist,pen=r-dist;
      m.position.x+=nxx*pen;m.position.z+=nzz*pen;
      const dot=m.userData.vx*nxx+m.userData.vz*nzz;
      if(dot<0){m.userData.vx-=1.9*dot*nxx;m.userData.vz-=1.9*dot*nzz;}
      m.userData.vx*=0.82;m.userData.vz*=0.82;m.userData.stuck++;
    }
  }
}

function separate(){
  for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){
    const a=marbles[i],b=marbles[j];
    if(a.userData.finished||b.userData.finished) continue;
    let dx=b.position.x-a.position.x,dz=b.position.z-a.position.z,d=Math.hypot(dx,dz);
    const minD=RADIUS*2.15;
    if(d<minD&&d>1e-6){
      const nx=dx/d,nz=dz/d,p=(minD-d)/2;
      a.position.x-=nx*p;a.position.z-=nz*p;b.position.x+=nx*p;b.position.z+=nz*p;
    }
  }
}

function steer(m){
  if(m.userData.finished) return;

  const id = m.userData.id;
  const tx = exitPos.x - m.position.x;
  const tz = exitPos.z - m.position.z;
  const dist = Math.hypot(tx, tz) || 1;

  if(m.userData.lastX === undefined){
    m.userData.lastX = m.position.x;
    m.userData.lastZ = m.position.z;
    m.userData.still = 0;
    m.userData.stuck = 0;
    m.userData.escapeUntil = 0;
  }

  const moved = Math.hypot(
    m.position.x - m.userData.lastX,
    m.position.z - m.userData.lastZ
  );

  m.userData.lastX = m.position.x;
  m.userData.lastZ = m.position.z;

  if(moved < 0.035)
    m.userData.still = (m.userData.still || 0) + 1;
  else
    m.userData.still = 0;

  const now = performance.now();
  const inEscape = now < (m.userData.escapeUntil || 0);
  const sp = Math.hypot(m.userData.vx, m.userData.vz);

  if(!inEscape && (
    m.userData.stuck > 4 ||
    m.userData.still > 28 ||
    sp < 0.008
  )){
    let bestAng = Math.random() * Math.PI * 2;
    let bestScore = -1e9;

    for(let k = 0; k < 24; k++){
      const ang =
        (k / 24) * Math.PI * 2 +
        id * 0.9 +
        Math.random() * 0.3;

      const lookDist = RADIUS + 1.6;

      const tx2 =
        m.position.x +
        Math.cos(ang) * lookDist;

      const tz2 =
        m.position.z +
        Math.sin(ang) * lookDist;

      let clear = 2.2;

      for(const w of walls){
        const qx = Math.max(
          w.x - w.hw,
          Math.min(tx2, w.x + w.hw)
        );

        const qz = Math.max(
          w.z - w.hd,
          Math.min(tz2, w.z + w.hd)
        );

        const d = Math.hypot(
          tx2 - qx,
          tz2 - qz
        );

        if(d < clear)
          clear = d;
      }

      const toExit = Math.hypot(
        tx2 - exitPos.x,
        tz2 - exitPos.z
      );

      const score =
        clear * 4.5 -
        toExit * 0.015 +
        Math.random() * 0.4;

      if(score > bestScore){
        bestScore = score;
        bestAng = ang;
      }
    }

    const burst =
      0.28 +
      Math.random() * 0.12;

    m.userData.vx =
      Math.cos(bestAng) * burst;

    m.userData.vz =
      Math.sin(bestAng) * burst;

    m.userData.stuck = 0;
    m.userData.still = 0;

    m.userData.escapeUntil =
      now + 450 + Math.random() * 250;

    return;
  }

  if(!inEscape){
    const speed =
      0.055 + id * 0.011;

    const t = now * 0.001;

    const wander =
      Math.sin(
        t * 1.7 +
        id * 2.4
      ) * 0.55;

    let ax =
      (tx / dist) * speed +
      (-tz / dist) *
      wander * 0.035;

    let az =
      (tz / dist) * speed +
      (tx / dist) *
      wander * 0.035;

    m.userData.vx += ax;
    m.userData.vz += az;
  }

  const sp2 =
    Math.hypot(
      m.userData.vx,
      m.userData.vz
    );

  const maxS =
    0.19 + id * 0.022;

  if(sp2 > maxS){
    m.userData.vx *= maxS / sp2;
    m.userData.vz *= maxS / sp2;
  }
}


let round=1,elapsed=0,winner=false,last=performance.now(),tick=0;

function startRound(){
  if(marbles.length<4) createAllMarbles();
  winner=false;elapsed=0;
  document.getElementById('round').textContent=round;
  document.getElementById('message').classList.remove('show');
  generateMaze();resetMarbles();
  marbles.forEach((m,i)=>{const a=(i/4)*Math.PI*2+0.8;m.userData.vx=Math.cos(a)*0.09;m.userData.vz=Math.sin(a)*0.09;});
  document.getElementById('status').textContent='4 marble: MERAH · BIRU · HIJAU · KUNING';
  const au=document.getElementById('rollingSound');if(au){au.volume=0.2;au.currentTime=0;au.play().catch(()=>{});}
}

function update(){
  if(winner) return;
  for(const m of marbles){
    if(m.userData.finished) continue;
    steer(m);
    m.position.x+=m.userData.vx;m.position.z+=m.userData.vz;
    m.userData.vx*=0.988;m.userData.vz*=0.988;
    collide(m);
    m.rotation.x+=m.userData.vz*2;m.rotation.z-=m.userData.vx*2;
    if(Math.hypot(m.position.x-exitPos.x,m.position.z-exitPos.z)<RADIUS+0.55){
      m.userData.finished=true;winner=true;
      document.getElementById('winner').textContent=NAMES[m.userData.id];
      document.getElementById('status').textContent=NAMES[m.userData.id]+' MENANG!';
      document.getElementById('message').classList.add('show');
      setTimeout(()=>{round++;startRound();},3000);break;
    }
  }
  separate();
  if(++tick%12===0) updateUI();
}

function animate(t){
  requestAnimationFrame(animate);
  if(!winner) elapsed+=(t-last)/1000;last=t;
  const s=Math.floor(elapsed);
  document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  update();renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

createAllMarbles();
generateMaze();
startRound();
</script></body></html>
