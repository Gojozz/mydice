<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

let round = 1, winner = false, elapsed = 0, last = performance.now(), tick = 0;
let trapMultiplier = 1;

const COLORS=[0xff2244,0x2288ff,0x22dd66,0xffdd00], NAMES=['MERAH','BIRU','HIJAU','KUNING'], RADIUS=0.95;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x120a05);

const aspect = innerWidth / innerHeight;
const camera = new THREE.PerspectiveCamera(aspect < 1 ? 64 : 44, aspect, 0.1, 200);
camera.position.set(0, aspect < 1 ? 95 : 68, aspect < 1 ? 34 : 24);
camera.lookAt(0, 0, 0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe6c0,0x3a2010,1.2));
const sun=new THREE.DirectionalLight(0xffffff,2.8);
sun.position.set(-25,50,25);
sun.castShadow=true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 150;
const d = 30;
sun.shadow.camera.left = -d;
sun.shadow.camera.right = d;
sun.shadow.camera.top = d;
sun.shadow.camera.bottom = -d;
sun.shadow.bias = -0.0005;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,0.3));

const CELL=2.6, SIZE=15, HALF=(SIZE-1)/2;
const board=new THREE.Mesh(new THREE.BoxGeometry(SIZE*CELL+1,0.5,SIZE*CELL+1),new THREE.MeshStandardMaterial({color:0xc49563,roughness:0.85}));
board.position.y=-0.3;
board.receiveShadow=true;
scene.add(board);

const maze=new THREE.Group();scene.add(maze);
const trapGroup=new THREE.Group();scene.add(trapGroup);
const starGroup=new THREE.Group();scene.add(starGroup);

const walls=[], traps=[], stars=[];
const wallMat=new THREE.MeshStandardMaterial({color:0x1a0e06,roughness:0.4});
let cells = [], exitPos={x:HALF*CELL, z:HALF*CELL};

function addWall(x,z,w,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.8,d),wallMat);
  m.position.set(x,1.2,z);
  m.castShadow=true;
  m.receiveShadow=true;
  maze.add(m);
  walls.push({x,z,w,d,hw:w/2,hd:d/2});
}

function createTrapMesh(px, pz, type){
  if(type === 'hole_blue' || type === 'hole_green'){
    const holeGroup = new THREE.Group();
    const ringColor = type === 'hole_blue' ? 0x00c8ff : 0x00ff55;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.6, 1.25, 32), 
      new THREE.MeshBasicMaterial({color: ringColor, side: THREE.DoubleSide})
    );
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04;
    const holeCore = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.1, 32), new THREE.MeshBasicMaterial({color: 0x000000}));
    holeCore.position.y = 0.02;
    holeGroup.add(ring, holeCore); holeGroup.position.set(px, 0, pz);
    trapGroup.add(holeGroup);
    traps.push({x: px, z: pz, type, mesh: holeGroup, active: true, ring});
  } else if(type === 'bomb'){
    const bGroup = new THREE.Group();
    const bombBody = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({color: 0x111111, emissive: 0xff2200, emissiveIntensity: 0.8, roughness:0.2}));
    bombBody.position.y = 0.8;
    bombBody.castShadow = true;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.4, 8), new THREE.MeshStandardMaterial({color: 0xffaa00}));
    cap.position.set(0, 1.5, 0);
    cap.castShadow = true;
    bGroup.add(bombBody, cap); bGroup.position.set(px, 0, pz);
    trapGroup.add(bGroup);
    traps.push({x: px, z: pz, type: 'bomb', mesh: bGroup, active: true, body: bombBody});
  }
}

function createStarMesh(px, pz){
  const starGeo = new THREE.OctahedronGeometry(0.7, 0);
  const starMat = new THREE.MeshStandardMaterial({color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8, metalness: 0.8, roughness: 0.2});
  const mesh = new THREE.Mesh(starGeo, starMat);
  mesh.position.set(px, 0.8, pz);
  mesh.castShadow = true;
  starGroup.add(mesh);
  stars.push({x: px, z: pz, mesh, active: true});
}

function generateMaze(){
  while(maze.children.length) maze.remove(maze.children[0]);
  while(trapGroup.children.length) trapGroup.remove(trapGroup.children[0]);
  while(starGroup.children.length) starGroup.remove(starGroup.children[0]);
  walls.length=0; traps.length=0; stars.length=0; cells=[];

  for(let z=0;z<SIZE;z++){cells[z]=[];for(let x=0;x<SIZE;x++) cells[z][x]={v:false,w:[true,true,true,true]};}
  const dirs=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
  function carve(x,z){
    cells[z][x].v=true;
    for(const di of [0,1,2,3].sort(()=>Math.random()-0.5)){
      const nx=x+dirs[di][0],nz=z+dirs[di][1];
      if(nx>=0&&nx<SIZE&&nz>=0&&nz<SIZE&&!cells[nz][nx].v){
        cells[z][x].w[dirs[di][2]]=false;cells[nz][nx].w[dirs[di][3]]=false;carve(nx,nz);
      }
    }
  }
  carve(0,0);

  for(let z=0; z<=2; z++){
    for(let x=0; x<=2; x++){
      if(x+1 <= 2){ cells[z][x].w[1] = false; cells[z][x+1].w[3] = false; }
      if(z+1 <= 2){ cells[z][x].w[2] = false; cells[z+1][x].w[0] = false; }
    }
  }

  for(let z=1;z<SIZE-1;z++) for(let x=1;x<SIZE-1;x++){
    if(Math.random()<0.12){
      const d=Math.floor(Math.random()*4);
      cells[z][x].w[d]=false;
      const nx=x+dirs[d][0], nz=z+dirs[d][1];
      if(nx>=0&&nx<SIZE&&nz>=0&&nz<SIZE) cells[nz][nx].w[dirs[d][3]]=false;
    }
  }

  const allValidCells = [];
  for(let z=1; z<SIZE-1; z++){
    for(let x=1; x<SIZE-1; x++){
      if((x<=2 && z<=2) || (x===SIZE-1 && z===SIZE-1)) continue;
      allValidCells.push({x, z});
    }
  }

  const occupiedKeys = new Set();
  allValidCells.sort(() => Math.random() - 0.5);

  // 1. BLACKHOLE BIRU
  const blueCount = Math.min(Math.floor(allValidCells.length * 0.4), 3 * trapMultiplier);
  for(let i = 0; i < blueCount; i++){
    const cell = allValidCells[i];
    const px = (cell.x - HALF)*CELL, pz = (cell.z - HALF)*CELL;
    createTrapMesh(px, pz, 'hole_blue');
    occupiedKeys.add(`${cell.x},${cell.z}`);
  }

  // 2. BLACKHOLE HIJAU (Tujuan Keluar Portal)
  const remainingForGreen = allValidCells.filter(c => !occupiedKeys.has(`${c.x},${c.z}`));
  remainingForGreen.sort(() => Math.random() - 0.5);
  const greenCount = Math.max(1, Math.min(remainingForGreen.length, 3 * trapMultiplier));
  for(let i = 0; i < greenCount; i++){
    const cell = remainingForGreen[i];
    const px = (cell.x - HALF)*CELL, pz = (cell.z - HALF)*CELL;
    createTrapMesh(px, pz, 'hole_green');
    occupiedKeys.add(`${cell.x},${cell.z}`);
  }

  // 3. BOM
  const remainingForBombs = allValidCells.filter(c => !occupiedKeys.has(`${c.x},${c.z}`));
  remainingForBombs.sort(() => Math.random() - 0.5);
  const bombCount = Math.min(remainingForBombs.length, 4 * trapMultiplier);
  for(let i = 0; i < bombCount; i++){
    const cell = remainingForBombs[i];
    const px = (cell.x - HALF)*CELL, pz = (cell.z - HALF)*CELL;
    createTrapMesh(px, pz, 'bomb');
    occupiedKeys.add(`${cell.x},${cell.z}`);
  }

  // 4. BINTANG
  const remainingForStars = allValidCells.filter(c => !occupiedKeys.has(`${c.x},${c.z}`));
  remainingForStars.sort(() => Math.random() - 0.5);
  const starCount = Math.min(remainingForStars.length, 5);
  for(let i = 0; i < starCount; i++){
    const cell = remainingForStars[i];
    const px = (cell.x - HALF)*CELL, pz = (cell.z - HALF)*CELL;
    createStarMesh(px, pz);
  }

  for(let z=0;z<SIZE;z++) for(let x=0;x<SIZE;x++){
    const c=cells[z][x],px=(x-HALF)*CELL,pz=(z-HALF)*CELL;
    if(c.w[0]) addWall(px,pz-CELL/2,CELL+0.25,0.4);
    if(c.w[1]) addWall(px+CELL/2,pz,0.4,CELL+0.25);
    if(c.w[2]&&!(x===SIZE-1&&z===SIZE-1)) addWall(px,pz+CELL/2,CELL+0.25,0.4);
    if(c.w[3]) addWall(px-CELL/2,pz,0.4,CELL+0.25);
  }
  const edge=HALF*CELL+CELL/2+0.2,span=SIZE*CELL+0.6;
  addWall(0,-edge,span,0.5);addWall(-edge,0,0.5,span);addWall(edge,0,0.5,span);
  addWall(-CELL*1.2,edge,span-CELL*2,0.5);
  exitPos={x:HALF*CELL,z:HALF*CELL};
}

const marbles=[];
function makeMarble(color, id, cloneId = 0){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(RADIUS,32,24),
    new THREE.MeshStandardMaterial({color,roughness:0.2,metalness:0.25,emissive:color,emissiveIntensity:0.18})
  );
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  
  const root=new THREE.Group();
  root.add(mesh);
  root.userData={id, cloneId, vx:0, vz:0, finished:false, eliminated:false, isTeleporting:false, teleportPhase: 'none'};
  return root;
}

function respawnMarble(m, i){
  const startCellX = 1, startCellZ = 1;
  const baseX = (startCellX - HALF) * CELL, baseZ = (startCellZ - HALF) * CELL;
  const gap = 1.3, offsets = [[-gap, -gap], [gap, -gap], [-gap, gap], [gap, gap]];
  const [ox, oz] = offsets[i % 4];

  m.scale.set(1, 1, 1);
  m.userData.isTeleporting = false;
  m.userData.teleportPhase = 'none';
  m.position.set(baseX + ox + (m.userData.cloneId * 0.4), RADIUS + 0.05, baseZ + oz + (m.userData.cloneId * 0.4));
  m.userData.vx = 0; m.userData.vz = 0;
  m.userData.stuckTime = 0;
  m.userData.targetCell = {x: startCellX, z: startCellZ};
  m.userData.currentCell = {x: startCellX, z: startCellZ};
  m.userData.visited = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  m.userData.visited[startCellZ][startCellX] = 1;
}

function resetMarbles(){
  while(marbles.length){scene.remove(marbles.pop());}
  for(let i=0; i<4; i++){
    const m = makeMarble(COLORS[i], i, 0);
    m.userData.speed = 0.088 + Math.random() * 0.025;
    m.userData.randomFactor = Math.random() * 6;
    scene.add(m);
    marbles.push(m);
    respawnMarble(m, i);
    m.userData.lastX = m.position.x; m.userData.lastZ = m.position.z;
  }
  updateUI();
}

function updateUI(){
  const box=document.getElementById('players');box.innerHTML='';
  [...marbles].map((m,i)=>({m, i, d:Math.hypot(m.position.x-exitPos.x,m.position.z-exitPos.z),eliminated:m.userData.eliminated}))
    .sort((a,b)=>{
      if(a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
      return a.d-b.d;
    }).forEach((r,place)=>{
      const div=document.createElement('div');
      div.className='player'+(r.eliminated?' dead':(place===0?' lead':''));
      const label = r.m.userData.cloneId > 0 ? `${NAMES[r.i]} (Klon ${r.m.userData.cloneId})` : NAMES[r.i];
      div.innerHTML=`<div class="dot" style="background:#${COLORS[r.i].toString(16).padStart(6,'0')}"></div> ${label}`;
      box.appendChild(div);
    });
}

function createExplosion(x,z){
  const exp=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16),new THREE.MeshBasicMaterial({color:0xff3300,wireframe:true}));
  exp.position.set(x,1,z);scene.add(exp);
  let s=1;
  const timer=setInterval(()=>{
    s+=0.9;exp.scale.set(s,s,s);
    if(s>7){scene.remove(exp);clearInterval(timer);}
  },25);
}

function createHolePulse(x, z, colorHex = 0x00c8ff){
  const pulse=new THREE.Mesh(new THREE.RingGeometry(0.2,1.8,32),new THREE.MeshBasicMaterial({color:colorHex,side:THREE.DoubleSide}));
  pulse.rotation.x=-Math.PI/2;pulse.position.set(x,0.06,z);scene.add(pulse);
  let s=1;
  const timer=setInterval(()=>{
    s-=0.07;pulse.scale.set(s,s,s);
    if(s<=0.1){scene.remove(pulse);clearInterval(timer);}
  },25);
}

function createStarEffect(x,z){
  const sparkle=new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16),new THREE.MeshBasicMaterial({color:0xffd700,wireframe:true}));
  sparkle.position.set(x, 1, z); scene.add(sparkle);
  let s=0.5;
  const timer=setInterval(()=>{
    s+=0.4; sparkle.scale.set(s,s,s);
    if(s>5){scene.remove(sparkle); clearInterval(timer);}
  }, 25);
}

function collide(m){
  const r=RADIUS;
  for(const w of walls){
    const nx=Math.max(w.x-w.hw,Math.min(m.position.x,w.x+w.hw));
    const nz=Math.max(w.z-w.hd,Math.min(m.position.z,w.z+w.hd));
    let dx=m.position.x-nx,dz=m.position.z-nz,dist=Math.hypot(dx,dz);
    if(dist<r&&dist>1e-6){
      const nxx=dx/dist,nzz=dz/dist,pen=r-dist;
      m.position.x+=nxx*pen;m.position.z+=nzz*pen;
      const dot=m.userData.vx*nxx+m.userData.vz*nzz;
      if(dot<0){m.userData.vx-=1.9*dot*nxx;m.userData.vz-=1.9*dot*nzz;}
      m.userData.vx*=0.82;m.userData.vz*=0.82;
    }
  }
}

function separate(){
  for(let i=0;i<marbles.length;i++) for(let j=i+1;j<marbles.length;j++){
    const a=marbles[i],b=marbles[j];
    if(a.userData.finished || b.userData.finished || a.userData.eliminated || b.userData.eliminated || a.userData.isTeleporting || b.userData.isTeleporting) continue;
    let dx=b.position.x-a.position.x,dz=b.position.z-a.position.z,d=Math.hypot(dx,dz);
    const minD=RADIUS*2.1;
    if(d<minD&&d>1e-6){
      const nx=dx/d,nz=dz/d,p=(minD-d)*0.5;
      a.position.x-=nx*p;a.position.z-=nz*p;
      b.position.x+=nx*p;b.position.z+=nz*p;
      const pushForce = 0.045;
      a.userData.vx -= nx * pushForce; a.userData.vz -= nz * pushForce;
      b.userData.vx += nx * pushForce; b.userData.vz += nz * pushForce;
    }
  }
}

function steer(m){
  if(m.userData.finished || m.userData.eliminated || m.userData.isTeleporting) return;
  const gx = Math.max(0, Math.min(SIZE - 1, Math.round(m.position.x / CELL + HALF)));
  const gz = Math.max(0, Math.min(SIZE - 1, Math.round(m.position.z / CELL + HALF)));

  const targetWorldX = (m.userData.targetCell.x - HALF) * CELL;
  const targetWorldZ = (m.userData.targetCell.z - HALF) * CELL;
  const distToTarget = Math.hypot(m.position.x - targetWorldX, m.position.z - targetWorldZ);

  if(distToTarget < 0.75 || (gx !== m.userData.currentCell.x || gz !== m.userData.currentCell.z)){
    m.userData.currentCell = {x: gx, z: gz};
    const dirs = [[0,-1],[1,0],[0,1],[-1,0]], validMoves = [];

    for(let i = 0; i < 4; i++){
      if(!cells[gz][gx].w[i]){
        const nx = gx + dirs[i][0], nz = gz + dirs[i][1];
        if(nx >= 0 && nx < SIZE && nz >= 0 && nz < SIZE){
          const visits = m.userData.visited[nz][nx];
          const distToExit = Math.hypot(nx - (SIZE - 1), nz - (SIZE - 1));
          const score = visits * 100 + distToExit + (Math.random() * m.userData.randomFactor);
          validMoves.push({x: nx, z: nz, score, visits});
        }
      }
    }

    if(validMoves.length > 0){
      validMoves.sort((a, b) => a.score - b.score);
      const chosen = validMoves[0];
      m.userData.targetCell = {x: chosen.x, z: chosen.z};
      m.userData.visited[chosen.z][chosen.x] += 1;
    }
  }

  const tx = (m.userData.targetCell.x - HALF) * CELL, tz = (m.userData.targetCell.z - HALF) * CELL;
  const dx = tx - m.position.x, dz = tz - m.position.z;
  const len = Math.hypot(dx, dz) || 1;

  m.userData.vx = THREE.MathUtils.lerp(m.userData.vx, (dx / len) * m.userData.speed, 0.16);
  m.userData.vz = THREE.MathUtils.lerp(m.userData.vz, (dz / len) * m.userData.speed, 0.16);
}

function startRound(){
  winner=false;elapsed=0;
  document.getElementById('round').textContent=round;
  document.getElementById('message').classList.remove('show');
  generateMaze();
  resetMarbles();
  document.getElementById('status').textContent=trapMultiplier > 1 ? `MARBLE RACE DIMULAI! (Perangkap ${trapMultiplier}x)` : 'MARBLE RACE DIMULAI!';
}

function update(){
  if(winner) return;

  traps.forEach(t => {
    if(t.type === 'bomb' && t.active && t.body){
      t.body.material.emissiveIntensity = 0.5 + Math.sin(performance.now() * 0.008) * 0.4;
    } else if((t.type === 'hole_blue' || t.type === 'hole_green') && t.active && t.ring){
      t.ring.rotation.z += (t.type === 'hole_blue' ? 0.05 : -0.05);
    }
  });

  stars.forEach(s => {
    if(s.active && s.mesh){
      s.mesh.rotation.y += 0.04;
      s.mesh.position.y = 0.8 + Math.sin(performance.now() * 0.005) * 0.2;
    }
  });

  for(const m of [...marbles]){
    if(m.userData.finished || m.userData.eliminated) continue;

    // ANIMASI PORTAL TELEPORT (BIRU -> HIJAU)
    if(m.userData.isTeleporting){
      if(m.userData.teleportPhase === 'in'){
        m.userData.teleportProgress = (m.userData.teleportProgress || 0) + 0.1;
        const p = m.userData.teleportProgress;
        m.position.x = THREE.MathUtils.lerp(m.position.x, m.userData.targetHole.x, 0.3);
        m.position.z = THREE.MathUtils.lerp(m.position.z, m.userData.targetHole.z, 0.3);
        const s = Math.max(0.01, 1 - p);
        m.scale.set(s, s, s);

        if(p >= 1.0){
          // Cari Blackhole Hijau secara acak untuk tempat keluar
          const greenHoles = traps.filter(t => t.type === 'hole_green' && t.active);
          if(greenHoles.length > 0){
            const dest = greenHoles[Math.floor(Math.random() * greenHoles.length)];
            m.position.set(dest.x, RADIUS + 0.05, dest.z);
            createHolePulse(dest.x, dest.z, 0x00ff55);
            m.userData.teleportPhase = 'out';
            m.userData.teleportProgress = 0;
            const gx = Math.max(0, Math.min(SIZE - 1, Math.round(dest.x / CELL + HALF)));
            const gz = Math.max(0, Math.min(SIZE - 1, Math.round(dest.z / CELL + HALF)));
            m.userData.currentCell = {x: gx, z: gz};
            m.userData.targetCell = {x: gx, z: gz};
          } else {
            respawnMarble(m, m.userData.id);
          }
        }
      } else if(m.userData.teleportPhase === 'out'){
        m.userData.teleportProgress = (m.userData.teleportProgress || 0) + 0.1;
        const p = m.userData.teleportProgress;
        const s = Math.min(1.0, p);
        m.scale.set(s, s, s);

        if(p >= 1.0){
          m.scale.set(1, 1, 1);
          m.userData.isTeleporting = false;
          m.userData.teleportPhase = 'none';
          m.userData.vx = (Math.random() - 0.5) * 0.1;
          m.userData.vz = (Math.random() - 0.5) * 0.1;
        }
      }
      continue;
    }

    const moved = Math.hypot(m.position.x - m.userData.lastX, m.position.z - m.userData.lastZ);
    m.userData.lastX = m.position.x; m.userData.lastZ = m.position.z;

    if(moved < 0.015){
      m.userData.stuckTime = (m.userData.stuckTime || 0) + 1;
      if(m.userData.stuckTime > 12){
        m.userData.vx += (Math.random() - 0.5) * 0.22;
        m.userData.vz += (Math.random() - 0.5) * 0.22;
      }
    } else {
      m.userData.stuckTime = Math.max(0, (m.userData.stuckTime || 0) - 1);
    }

    steer(m);
    m.position.x+=m.userData.vx;m.position.z+=m.userData.vz;
    m.userData.vx*=0.988;m.userData.vz*=0.988;
    collide(m);
    m.rotation.x+=m.userData.vz*2;m.rotation.z-=m.userData.vx*2;

    for(const s of stars){
      if(!s.active) continue;
      const dist = Math.hypot(m.position.x - s.x, m.position.z - s.z);
      if(dist < 1.35){
        s.active = false;
        starGroup.remove(s.mesh);
        createStarEffect(s.x, s.z);

        const colorId = m.userData.id;
        const currentClones = marbles.filter(item => item.userData.id === colorId && !item.userData.eliminated).length;

        if(currentClones <= 3){
          const newCloneId = marbles.filter(item => item.userData.id === colorId).length;
          const cloneMesh = makeMarble(COLORS[colorId], colorId, newCloneId);
          cloneMesh.userData.speed = m.userData.speed;
          cloneMesh.userData.randomFactor = m.userData.randomFactor;
          scene.add(cloneMesh);
          marbles.push(cloneMesh);
          respawnMarble(cloneMesh, colorId);
          document.getElementById('status').textContent = `★ BINTANG! ${NAMES[colorId]} BERHASIL CLONE (${currentClones}/3)!`;
        } else {
          document.getElementById('status').textContent = `★ ${NAMES[colorId]} MENDAPATKAN BINTANG (Klon Maksimal)`;
        }
        updateUI();
        break;
      }
    }

    for(const t of traps){
      if(!t.active) continue;
      const dist = Math.hypot(m.position.x - t.x, m.position.z - t.z);
      if(dist < 1.3){
        if(t.type === 'bomb' && dist < 1.1){
          m.userData.finished = true; m.userData.eliminated = true; m.visible = false;
          t.active = false; trapGroup.remove(t.mesh);
          createExplosion(t.x, t.z);
          document.getElementById('status').textContent = `BOM! ${NAMES[m.userData.id]} MELEDAK & GUGUR!`;
          updateUI();
        } else if(t.type === 'hole_blue'){
          m.userData.isTeleporting = true;
          m.userData.teleportPhase = 'in';
          m.userData.teleportProgress = 0;
          m.userData.targetHole = {x: t.x, z: t.z};
          createHolePulse(t.x, t.z, 0x00c8ff);
          document.getElementById('status').textContent = `PORTAL! ${NAMES[m.userData.id]} MASUK BLACKHOLE BIRU -> KELUAR DI BLACKHOLE HIJAU!`;
        }
        break;
      }
    }

    if(!m.userData.finished && !m.userData.eliminated && Math.hypot(m.position.x-exitPos.x, m.position.z-exitPos.z) < RADIUS + 0.45){
      m.userData.finished=true;winner=true;
      trapMultiplier = 1;
      document.getElementById('winner').textContent=NAMES[m.userData.id] + (m.userData.cloneId > 0 ? ` (Klon ${m.userData.cloneId})` : '') + ' MENANG!';
      document.getElementById('status').textContent=NAMES[m.userData.id]+' BERHASIL KELUAR!';
      document.getElementById('message').classList.add('show');
      setTimeout(()=>{round++;startRound();},3500);break;
    }
  }

  const allEliminated = marbles.every(m => m.userData.eliminated);
  if(allEliminated && !winner){
    winner = true;
    trapMultiplier = 1;
    document.getElementById('winner').textContent = 'SEMUA MELEDAK!';
    document.getElementById('status').textContent = 'Semua marble gugur terkena bom! Ulang ronde...';
    document.getElementById('message').classList.add('show');
    setTimeout(()=>{ round++; startRound(); }, 3500);
  }

  if(elapsed >= 180 && !winner){
    winner = true;
    trapMultiplier *= 2;
    document.getElementById('winner').textContent = 'WAKTU HABIS!';
    document.getElementById('status').textContent = `Waktu 3 menit habis! Perangkap dilipatgandakan (${trapMultiplier}x)...`;
    document.getElementById('message').classList.add('show');
    setTimeout(()=>{ round++; startRound(); }, 3500);
  }

  separate();
  if(++tick%12===0) updateUI();
}

function animate(t){
  requestAnimationFrame(animate);
  if(!winner) elapsed+=(t-last)/1000;last=t;
  document.getElementById('timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
  update();renderer.render(scene,camera);
}

startRound(); requestAnimationFrame(animate);
addEventListener('resize',()=>{
  const asp = innerWidth / innerHeight;
  camera.aspect = asp;
  camera.fov = asp < 1 ? 64 : 44;
  camera.position.set(0, asp < 1 ? 95 : 68, asp < 1 ? 34 : 24);
  camera.updatePolyMatrix ? camera.updatePolyMatrix() : camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script></body></html>
