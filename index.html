<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Marble Maze</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d07;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}
canvas{display:block}

#hud{
 position:fixed;z-index:5;top:10px;left:50%;
 transform:translateX(-50%);width:100%;
 text-align:center;pointer-events:none;
 text-shadow:0 2px 5px #000
}
h1{
 margin:0;font-size:clamp(25px,6vw,42px);
 font-weight:900;letter-spacing:3px;color:#ffd166
}
.sub{
 font-size:10px;letter-spacing:2px;color:#f5d7a0
}
.badge{
 display:inline-block;margin-top:7px;padding:5px 14px;
 background:#24140ae8;border:2px solid #b9782e;
 border-radius:20px;font-size:12px;font-weight:bold
}
#timer{color:#ffe45c;margin-left:8px}

#players{
 position:fixed;z-index:6;top:10px;right:10px;
 display:flex;gap:5px
}
.player{
 min-width:65px;padding:5px;
 background:#21130be8;border:2px solid #6d4525;
 border-radius:9px;text-align:center;font-size:9px
}
.dot{
 width:14px;height:14px;border-radius:50%;
 margin:0 auto 3px;box-shadow:0 2px 5px #000
}

#status{
 position:fixed;z-index:6;bottom:12px;left:50%;
 transform:translateX(-50%);
 padding:7px 14px;background:#21130be8;
 border:1px solid #87582d;border-radius:20px;
 font-size:11px;white-space:nowrap
}

#message{
 position:fixed;z-index:10;inset:0;
 display:none;align-items:center;justify-content:center;
 background:#0009
}
#message.show{display:flex}
.messageBox{
 padding:25px 35px;text-align:center;
 background:linear-gradient(145deg,#3b210d,#160d07);
 border:3px solid #e9ae45;border-radius:18px;
 box-shadow:0 0 40px #000
}
.messageBox small{color:#e9c88f}
.messageBox h2{
 margin:5px 0;color:#ffd166;font-size:30px
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
 <h1>MARBLE MAZE</h1>
 <div class="sub">WOODEN LABYRINTH</div>
 <div class="badge">
   RONDE <span id="round">1</span>
   <span id="timer">00:00</span>
 </div>
</div>

<div id="players"></div>

<div id="status">Menyiapkan labirin...</div>

<div id="message">
 <div class="messageBox">
   <small>PEMENANG</small>
   <h2 id="winner">MERAH</h2>
   <small>Marble berhasil keluar!</small>
 </div>
</div>

<audio
 id="rollingSound"
 src="assets/sound/marble-rolling.mp3"
 preload="auto"
 loop>
</audio>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


/* =========================================================
   BASIC THREE.JS
========================================================= */

const game=document.getElementById('game');

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x21150b);

scene.fog=new THREE.Fog(
 0x21150b,
 28,
 65
);


const camera=new THREE.PerspectiveCamera(
 45,
 innerWidth/innerHeight,
 0.1,
 100
);

camera.position.set(
 0,
 29,
 24
);

camera.lookAt(
 0,
 0,
 0
);


const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
 THREE.PCFSoftShadowMap;

game.appendChild(
 renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const ambient=new THREE.HemisphereLight(
 0xffe4b5,
 0x352010,
 2.2
);

scene.add(ambient);


const light=new THREE.DirectionalLight(
 0xffd79a,
 3
);

light.position.set(
 -15,
 30,
 12
);

light.castShadow=true;

light.shadow.mapSize.width=2048;
light.shadow.mapSize.height=2048;

scene.add(light);


/* =========================================================
   WOODEN BOARD
========================================================= */

const board=new THREE.Mesh(

 new THREE.BoxGeometry(
  25,
  .5,
  25
 ),

 new THREE.MeshStandardMaterial({
  color:0x8b5528,
  roughness:.72
 })

);

board.position.y=-.35;

board.receiveShadow=true;

scene.add(board);


/* =========================================================
   MAZE
========================================================= */

const maze=new THREE.Group();

scene.add(maze);

const walls=[];

const CELL=2.5;
const SIZE=9;
const HALF=(SIZE-1)/2;


function wall(
 x,
 z,
 width,
 depth
){

 const mesh=new THREE.Mesh(

  new THREE.BoxGeometry(
   width,
   1.7,
   depth
  ),

  new THREE.MeshStandardMaterial({
   color:0x6f3f19,
   roughness:.68
  })

 );

 mesh.position.set(
  x,
  .55,
  z
 );

 mesh.castShadow=true;
 mesh.receiveShadow=true;

 maze.add(mesh);

 walls.push({
  x,
  z,
  width,
  depth
 });

}


/* =========================================================
   PROCEDURAL MAZE
========================================================= */

let exitPosition={
 x:0,
 z:0
};


function generateMaze(){

 while(maze.children.length)
  maze.remove(
   maze.children[0]
  );

 walls.length=0;


 const cells=[];

 for(let z=0;z<SIZE;z++){

  cells[z]=[];

  for(let x=0;x<SIZE;x++){

   cells[z][x]={
    visited:false,
    walls:[true,true,true,true]
   };

  }

 }


 const directions=[

  [0,-1,0,2],
  [1,0,1,3],
  [0,1,2,0],
  [-1,0,3,1]

 ];


 function carve(x,z){

  cells[z][x].visited=true;

  const order=[
   0,1,2,3
  ].sort(
   ()=>Math.random()-.5
  );


  for(const d of order){

   const nx=
    x+directions[d][0];

   const nz=
    z+directions[d][1];


   if(
    nx>=0 &&
    nx<SIZE &&
    nz>=0 &&
    nz<SIZE &&
    !cells[nz][nx].visited
   ){

    cells[z][x]
     .walls[
      directions[d][2]
     ]=false;

    cells[nz][nx]
     .walls[
      directions[d][3]
     ]=false;

    carve(nx,nz);

   }

  }

 }


 carve(0,0);


 for(let z=0;z<SIZE;z++){

  for(let x=0;x<SIZE;x++){

   const c=cells[z][x];

   const px=
    (x-HALF)*CELL;

   const pz=
    (z-HALF)*CELL;


   /* TOP */

   if(c.walls[0]){

    wall(
     px,
     pz-CELL/2,
     CELL+.12,
     .25
    );

   }


   /* LEFT */

   if(c.walls[3]){

    wall(
     px-CELL/2,
     pz,
     .25,
     CELL+.12
    );

   }


   /* RIGHT EDGE */

   if(x===SIZE-1){

    wall(
     px+CELL/2,
     pz,
     .25,
     CELL+.12
    );

   }


   /* BOTTOM EDGE */

   if(z===SIZE-1){

    /*
      Buka sedikit dinding di posisi finish
      agar marble bisa keluar.
    */

    if(x!==SIZE-1){

     wall(
      px,
      pz+CELL/2,
      CELL+.12,
      .25
     );

    }

   }

  }

 }


 exitPosition={
  x:HALF*CELL,
  z:HALF*CELL
 };


 createFinish();

}


/* =========================================================
   FINISH
========================================================= */

function createFinish(){

 const finish=new THREE.Mesh(

  new THREE.CylinderGeometry(
   .72,
   .72,
   .08,
   32
  ),

  new THREE.MeshStandardMaterial({
   color:0xffd43b,
   emissive:0x6d4200,
   emissiveIntensity:1.2
  })

 );

 finish.position.set(
  exitPosition.x,
  .03,
  exitPosition.z
 );

 scene.add(finish);

}


/* =========================================================
   MARBLES
========================================================= */

const marbleColors=[
  0xd92828,
  0x246bff,
  0x28b84a,
  0xf2c52e
];

const marbleNames=[
 'MERAH',
 'BIRU',
 'HIJAU',
 'KUNING'
];

const marbles=[];

let marbleTemplate=null;

const loader=new GLTFLoader();


loader.load(

 'assets/roter_ball_glb.glb',

 gltf=>{

  marbleTemplate=gltf.scene;

  marbleTemplate.traverse(
   object=>{

    if(object.isMesh){

     object.castShadow=true;
     object.receiveShadow=true;

    }

   }
  );


  for(
   let i=0;
   i<4;
   i++
  ){

   const marble=
    marbleTemplate.clone(true);

   marble.scale.setScalar(
    .52
   );

   marble.visible=true;

   scene.add(marble);

   marbles.push(marble);

  }


  resetMarbles();

 },

 undefined,

 error=>{

  console.error(
   'Gagal memuat GLB:',
   error
  );

  document.getElementById(
   'status'
  ).textContent=
   'Gagal memuat marble GLB';

 }

);


/* =========================================================
   MARBLE RESET
========================================================= */

function resetMarbles(){

 const starts=[

  [-10,-10],
  [-7.5,-10],
  [-10,-7.5],
  [-7.5,-7.5]

 ];


 marbles.forEach(
  (marble,index)=>{

   marble.position.set(
    starts[index][0],
    .58,
    starts[index][1]
   );


   marble.userData={
    vx:0,
    vz:0,
    finished:false
   };

  }
 );


 updatePlayers();

}


/* =========================================================
   PLAYER UI
========================================================= */

function updatePlayers(){

 const box=
  document.getElementById(
   'players'
  );

 box.innerHTML='';


 marbleNames.forEach(
  (name,index)=>{

   const div=
    document.createElement(
     'div'
    );

   div.className='player';

   div.innerHTML=`

    <div
      class="dot"
      style="
       background:#${marbleColors[index]
        .toString(16)
        .padStart(6,'0')}
      ">
    </div>

    ${name}

   `;

   box.appendChild(div);

  }
 );

}


/* =========================================================
   COLLISION
========================================================= */

function collideMarble(marble){

 const radius=.46;


 for(
  const w of walls
 ){

  const insideX=
   Math.abs(
    marble.position.x-w.x
   )
   <
   w.width/2+radius;


  const insideZ=
   Math.abs(
    marble.position.z-w.z
   )
   <
   w.depth/2+radius;


  if(
   insideX &&
   insideZ
  ){

   if(
    w.width>w.depth
   ){

    if(
     marble.position.z>w.z
    )
     marble.position.z=
      w.z+
      w.depth/2+
      radius;

    else
     marble.position.z=
      w.z-
      w.depth/2-
      radius;


    marble.userData.vz*=
     -.55;

   }else{

    if(
     marble.position.x>w.x
    )
     marble.position.x=
      w.x+
      w.width/2+
      radius;

    else
     marble.position.x=
      w.x-
      w.width/2-
      radius;


    marble.userData.vx*=
     -.55;

   }

  }

 }

}


/* =========================================================
   GAME
========================================================= */

let round=1;

let elapsed=0;

let winner=false;

let lastTime=
 performance.now();


function startRound(){

 winner=false;

 elapsed=0;

 document.getElementById(
  'round'
 ).textContent=
  round;


 document.getElementById(
  'status'
 ).textContent=
  'Marble mulai menggelinding...';


 generateMaze();

 resetMarbles();


 /*
  Gerakan awal kecil.
  Nantinya bagian ini akan diganti
  dengan sistem kontrol/bot pemain.
 */

 marbles.forEach(
  (marble,index)=>{

   marble.userData.vx=
    index===1 ? .045 :
    index===3 ? .025 :
    .015;


   marble.userData.vz=
    .045+
    index*.004;

  }
 );


 const audio=
  document.getElementById(
   'rollingSound'
  );

 audio.volume=.28;

 audio.currentTime=0;

 audio.play().catch(
  ()=>{}
 );

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

 if(winner)
  return;


 for(
  const marble of marbles
 ){

  if(
   marble.userData.finished
  )
   continue;


  /*
   Gravitasi ringan agar terasa
   seperti marble yang menggelinding.
  */

  marble.userData.vz+=
   .0008;


  marble.position.x+=
   marble.userData.vx;

  marble.position.z+=
   marble.userData.vz;


  /*
   Gesekan
  */

  marble.userData.vx*=.992;

  marble.userData.vz*=.992;


  collideMarble(
   marble
  );


  /*
   Rotasi marble
  */

  marble.rotation.x+=
   marble.userData.vz*2;

  marble.rotation.z-=
   marble.userData.vx*2;


  /*
   Finish
  */

  const dx=
   marble.position.x-
   exitPosition.x;

  const dz=
   marble.position.z-
   exitPosition.z;


  if(
   Math.hypot(dx,dz)<.85
  ){

   marble.userData.finished=true;

   winner=true;

   document.getElementById(
    'winner'
   ).textContent=
    marbleNames[
     marbles.indexOf(marble)
    ];


   document.getElementById(
    'status'
   ).textContent=
    marbleNames[
     marbles.indexOf(marble)
    ]+
    ' MENANG!';


   document.getElementById(
    'message'
   ).classList.add(
    'show'
   );


   document.getElementById(
    'rollingSound'
   ).pause();


   setTimeout(
    ()=>{

     document.getElementById(
      'message'
     ).classList.remove(
      'show'
     );

     round++;

     startRound();

    },
    3500
   );

  }

 }

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(time){

 requestAnimationFrame(
  animate
 );


 if(
  !winner
 ){

  elapsed+=
   (time-lastTime)/1000;

 }


 lastTime=time;


 update();


 const total=
  Math.floor(elapsed);


 const minutes=
  Math.floor(total/60)
   .toString()
   .padStart(2,'0');


 const seconds=
  (total%60)
   .toString()
   .padStart(2,'0');


 document.getElementById(
  'timer'
 ).textContent=
  minutes+':'+seconds;


 renderer.render(
  scene,
  camera
 );

}


requestAnimationFrame(
 animate
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
 'resize',
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


/* =========================================================
   START
========================================================= */

startRound();

</script>

</body>
</html>
