name: YouTube Live Stream

on:
  workflow_dispatch:
  schedule:
    # Setiap 6 jam (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: "0 */6 * * *"

concurrency:
  group: youtube-live-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            pulseaudio-utils \
            imagemagick \
            mesa-utils \
            libgl1-mesa-dri \
            python3-pip \
            wget

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages pytchat httpx google-api-python-client google-auth google-auth-httplib2

      - name: Install Piper TTS
        run: |
          echo "===== INSTALL PIPER TTS ====="
          python3 -m pip install --break-system-packages piper-tts
          command -v piper
          piper --help | head -10
          mkdir -p piper_models
          cd piper_models
          wget -q --show-progress \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          wget -q --show-progress \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          cd ..
          ls -lh piper_models/en_US-lessac-medium.*

      - name: Start PulseAudio
        run: |
          echo "===== START PULSEAUDIO ====="
          pulseaudio --start --system=false --exit-idle-time=-1
          pactl load-module module-null-sink \
            sink_name=stream_sink \
            sink_properties=device.description=StreamSink
          pactl set-sink-mute stream_sink 0
          pactl set-sink-volume stream_sink 100%
          pactl set-default-sink stream_sink
          pactl info
          pactl list short sinks

      - name: Create YouTube Broadcast
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_VERTICAL_STREAM_KEY: ${{ secrets.YOUTUBE_VERTICAL_STREAM_KEY }}
        run: |
          echo "===== CREATE YOUTUBE BROADCAST (9:16 via stream key biasa) ====="
          python3 youtube_broadcast.py | tee youtube-broadcast.log
          VIDEO_ID=$(grep '^VIDEO_ID=' youtube-broadcast.log | tail -1 | cut -d= -f2)
          if [ -z "$VIDEO_ID" ]; then
            echo "ERROR: VIDEO_ID tidak ditemukan."
            exit 1
          fi
          echo "VIDEO_ID=$VIDEO_ID"
          echo "YOUTUBE_LIVE_ID=$VIDEO_ID" >> "$GITHUB_ENV"
          VERTICAL_VIDEO_ID=$(grep '^VERTICAL_VIDEO_ID=' youtube-broadcast.log | tail -1 | cut -d= -f2 || true)
          if [ -n "$VERTICAL_VIDEO_ID" ]; then
            echo "VERTICAL_VIDEO_ID=$VERTICAL_VIDEO_ID"
            echo "YOUTUBE_VERTICAL_LIVE_ID=$VERTICAL_VIDEO_ID" >> "$GITHUB_ENV"
          else
            echo "VERTICAL_VIDEO_ID tidak ada (vertical broadcast di-skip atau gagal)."
          fi
          echo "===== YOUTUBE BROADCAST READY ====="

      - name: Start Chat Bot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_LIVE_ID: ${{ env.YOUTUBE_LIVE_ID }}
          YOUTUBE_VERTICAL_LIVE_ID: ${{ env.YOUTUBE_VERTICAL_LIVE_ID }}
          PIPER_BIN: piper
          PIPER_MODEL: ${{ github.workspace }}/piper_models/en_US-lessac-medium.onnx
          PULSE_SINK: stream_sink
        run: |
          echo "===== START CHAT BOT ====="
          python3 -u bot.py > bot.log 2>bot-error.log &
          sleep 3
          ps aux | grep '[p]ython3 bot.py' || true
          cat bot.log 2>/dev/null || true
          cat bot-error.log 2>/dev/null || true

      - name: Check dependencies
        run: |
          command -v ffmpeg
          ffmpeg -version | head -1
          command -v google-chrome
          google-chrome --version

      - name: Start Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_VERTICAL_STREAM_KEY: ${{ secrets.YOUTUBE_VERTICAL_STREAM_KEY }}
        run: |
          echo "===== START XVFB :99 (720x1280 — 9:16 Shorts) ====="
          Xvfb :99 -screen 0 720x1280x24 &
          export DISPLAY=:99
          sleep 3

          sudo mkdir -p /etc/opt/chrome/policies/managed
          printf '%s\n' '{' '  "TranslateEnabled": false' '}' | sudo tee /etc/opt/chrome/policies/managed/stream-policy.json > /dev/null
          sleep 1

          echo "===== START HTTP SERVER ====="
          python3 -m http.server 8000 > http.log 2>&1 &
          sleep 3

          echo "===== START CHROMIUM (9:16 portrait) ====="
          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu-sandbox \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=720,1280 \
            --kiosk \
            --no-first-run \
            --autoplay-policy=no-user-gesture-required \
            --disable-features=Translate,TranslateUI \
            --disable-translate \
            --lang=id-ID \
            --user-data-dir=/tmp/chromium-profile \
            http://127.0.0.1:8000/index.html &

          sleep 12

          echo "===== CHROMIUM PROCESS ====="
          ps aux | grep chromium | grep -v grep || true

          echo "===== SCREEN TEST ====="
          import -display :99 -window root /tmp/stream-screen.png || true
          file /tmp/stream-screen.png || true

                    echo "===== START FFMPEG LOOP (9:16 Shorts only) ====="
          set +e

          # Stream key: prioritaskan VERTICAL, fallback ke STREAM_KEY
          STREAM_OUT_KEY="$YOUTUBE_STREAM_KEY"
          if [ -z "$STREAM_OUT_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY kosong"
            exit 1
          fi
          echo "Output 720x1280 (9:16) → YOUTUBE_STREAM_KEY"

          while true; do
            ffmpeg \
              -hide_banner \
              -draw_mouse 0 \
              -thread_queue_size 1024 \
              -f x11grab \
              -video_size 720x1280 \
              -framerate 30 \
              -i :99.0 \
              -thread_queue_size 1024 \
              -f pulse \
              -i stream_sink.monitor \
              -map 0:v -map 1:a \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -b:v 2500k \
              -maxrate 2500k \
              -bufsize 5000k \
              -g 60 \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"

            echo "FFmpeg terhenti. Reconnect dalam 3 detik..."
            sleep 3
          done

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-diagnostic
          path: |
            /tmp/stream-screen-land.png
            /tmp/stream-screen-vert.png
            /tmp/stream-screen.png
            http.log
            bot.log
            bot-error.log
            chat_state.json
            youtube-broadcast.log
